    <section class="group"><div class="eyebrow"><${Icon} n="zap" s=${14} />Automations</div>
      <${Row} label="Main account" tip="Where automations link new cards. Leave it on the first account to use whichever account is furthest left.">
        <span class="set-control wide"><${Select} label="Main account" value=${s.primaryAccount && cards[s.primaryAccount] ? s.primaryAccount : ''}
          options=${[{ value: '', label: 'First account on the board' }].concat(accounts.map((a) => ({ value: a.id, label: a.title || 'Account', hint: ACCOUNT_TYPES[atypeOf(a)] })))} onChange=${(v) => set({ primaryAccount: v })} /></span><//>
      <div>${AUTOS.map(([k, text, name]) => html`<div key=${k} class="auto"><div class="auto-text">${text}</div><${Switch} on=${s.auto[k]} label=${name} onChange=${(v) => setAuto(k, v)} /></div>`)}</div>
      <button class="btn-sm" style=${{ alignSelf: 'flex-start' }} onClick=${onArrange}><${Icon} n="arrange" s=${16} />Arrange cards by flow</button>
    </section>
    <section class="group"><div class="eyebrow">Display, just for you</div>
      <${Row} label="Info tips" sub="Show the (i) icons"><${Switch} on=${prefs.showTips} label="Show info tips" onChange=${(v) => setPrefs({ showTips: v })} /><//>
      <${Row} label="Amounts on links" sub="Show what flows along each link"><${Switch} on=${prefs.showAmounts} label="Show amounts on links" onChange=${(v) => setPrefs({ showAmounts: v })} /><//>
    </section>
    <section class="group" id="a11y-settings"><div class="eyebrow">Accessibility, just for you</div>
      <${Row} label="Theme" tip="System follows your device. Light or Dark overrides it on this board only.">
        <span class="set-control"><${Select} label="Theme" value=${prefs.theme} searchable=${false} options=${[{ value: 'system', label: 'Match system' }, { value: 'light', label: 'Light' }, { value: 'dark', label: 'Dark' }]} onChange=${(v) => setPrefs({ theme: v })} /></span><//>
      <${Row} label="Text size" sub="Toolbars, panels and menus" tip="Makes the text around the board bigger. To enlarge the cards themselves, zoom the canvas with + or pinch.">
        <div class="seg set-control" role="group" aria-label="Text size">${[[100, '100%'], [115, '115%'], [130, '130%']].map(([v, l]) => html`<button key=${v} class=${prefs.textSize === v ? 'on' : ''} aria-pressed=${prefs.textSize === v} onClick=${() => setPrefs({ textSize: v })}>${l}</button>`)}</div><//>
      <${Row} label="High contrast" sub="Darker text and stronger borders" tip="Raises text to at least 7:1 contrast against its background and makes borders and controls stand out more, in both light and dark themes.">
        <${Switch} on=${prefs.contrast} label="High contrast" onChange=${(v) => setPrefs({ contrast: v })} /><//>
      <${Row} label="Colour-blind-safe colours" sub="Gains in blue, losses in orange" tip="Replaces green and red, which many people can’t tell apart, with blue and orange. Gains and losses always keep their + and − signs and arrows too.">
        <${Switch} on=${prefs.cbSafe} label="Colour-blind-safe colours" onChange=${(v) => setPrefs({ cbSafe: v })} /><//>
      <${Row} label="Reduce motion" sub="Turn off animations and slides" tip="Stops menus, progress bars and cursors from animating. If your device is set to reduce motion, that is always respected too.">
        <${Switch} on=${prefs.reduceMotion} label="Reduce motion" onChange=${(v) => setPrefs({ reduceMotion: v })} /><//>
      <${Row} label="Extra text spacing" sub="More room between letters, words and lines" tip="Adds letter, word and line spacing, which many people with dyslexia find easier to read.">
        <${Switch} on=${prefs.spacing} label="Extra text spacing" onChange=${(v) => setPrefs({ spacing: v })} /><//>
      <${Row} label="Stronger focus outline" sub="A thicker ring on the focused control" tip="Makes it easier to see where you are when moving through the board with the keyboard.">
        <${Switch} on=${prefs.focusStrong} label="Stronger focus outline" onChange=${(v) => setPrefs({ focusStrong: v })} /><//>
      <${Row} label="Hide other people’s cursors" sub="Less movement on the board" tip="Other people still see yours, and the card they are editing is still outlined.">
        <${Switch} on=${prefs.hideCursors} label="Hide other people’s cursors" onChange=${(v) => setPrefs({ hideCursors: v })} /><//>
      <${Row} label="Announce changes" sub="For screen readers" tip="Reads out the new monthly left-over figure and the number of problems when they change, including changes other people make.">
        <${Switch} on=${prefs.announce} label="Announce changes" onChange=${(v) => setPrefs({ announce: v })} /><//>
      <div class="group"><div class="eyebrow">Keyboard shortcuts</div>
        <dl class="keys">
          ${[['Arrow keys', 'Move around the board (hold Shift to go faster)'], ['+ and −', 'Zoom in and out'], ['0', 'Fit the whole board on screen'], ['V / H', 'Select tool / pan tool (or hold Space)'], ['Tab', 'Move between cards and fields. Focusing a card selects it.'], ['Link to…', 'Connect the selected card without dragging, then pick the card to send money to'], ['Ctrl or ⌘ + Z', 'Undo (add Shift to redo)'], ['Ctrl or ⌘ + D', 'Duplicate the selected card'], ['Delete', 'Remove the selected card or link'], ['Esc', 'Deselect, cancel linking, close a menu or panel'], ['?', 'Open these settings']]
            .map(([k, d]) => html`<div key=${k} class="key-row"><dt><kbd>${k}</kbd></dt><dd>${d}</dd></div>`)}
        </dl>
      </div>
      <button class="btn-sm" style=${{ alignSelf: 'flex-start' }} onClick=${() => setPrefs({ theme: 'system', textSize: 100, contrast: false, cbSafe: false, reduceMotion: false, spacing: false, focusStrong: false, hideCursors: false, announce: false })}>Reset accessibility settings</button>
    </section>
    <section class="group"><div class="eyebrow">This scenario</div>
      ${!confirm ? html`<button class="btn-sm" style=${{ alignSelf: 'flex-start' }} disabled=${!count} onClick=${() => setConfirm(true)}><${Icon} n="trash" s=${16} />Clear “${scenarioName}”</button>`
        : html`<div class="confirm" role="alert"><p>Delete all ${plural(count, 'card')} in “${scenarioName}” for everyone? You can undo this.</p>
            <div style=${{ display: 'flex', gap: '8px' }}><button class="btn-sm danger" onClick=${() => { onClear(); setConfirm(false); }}>Delete the cards</button><button class="btn-sm" onClick=${() => setConfirm(false)}>Keep them</button></div></div>`}
    </section>
  <//>`;
}

function HistoryPanel({ entries, onClose, hist, nameOf, me, scenarioNames, mode }) {
  const pk = hist.peek();
  return html`<${Panel} title="History" sub="Every change made on this board in the last 30 days, newest first." onClose=${onClose}>
    <section class="group"><div class="eyebrow">Your changes</div>
      <div class="undo-box">
        <button class="btn-sm" disabled=${!pk.undo} onClick=${hist.undo}><${Icon} n="undo" s=${16} />${pk.undo ? 'Undo: ' + pk.undo.label.slice(0, 36) : 'Nothing to undo'}</button>
        ${pk.redo ? html`<button class="btn-sm" onClick=${hist.redo}><${Icon} n="redo" s=${16} />Redo</button>` : null}
      </div>
      <p class="muted">Undo reverses your own changes in this session, newest first. It won’t undo other people’s changes.</p>
    </section>
    <section class="group"><div class="eyebrow">Everyone’s changes</div>
      ${!entries.length ? html`<p class="muted">No changes yet. Edits, links, imports and templates show up here.</p>` : null}
      <div>${entries.map((e, i) => {
        const who = e.mine ? 'You' : (mode === 'local' ? 'You' : (nameOf(e.who) || 'Someone'));
        const col = hashN(e.who || (e.mine ? me : 'x'));
        return html`<div key=${i} class="hist-row"><span class=${'av p' + col}>${initials(who)}</span>
          <div><div class="hist-text"><b>${who}</b> · ${e.text}</div>
            <div class="hist-meta">${ago(e.t)}${e.sid && scenarioNames[e.sid] ? html`<span class="scen-tag">${scenarioNames[e.sid]}</span>` : null}</div></div></div>`;
      })}</div>
    </section>
  <//>`;
}

function ComparePanel({ onClose, raw, sid, cards, links, settings, scenarioList, onSwitch }) {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const load = useCallback(() => {
    setErr(null);
    Promise.all(scenarioList.slice(0, 4).map((s) => (s.id === sid ? Promise.resolve({ cards, links }) : raw.getScenario(s.id)).then((d) => ({ ...s, m: scenarioMetrics(d.cards, d.links, settings) }))))
      .then(setData).catch(() => setErr('The scenarios couldn’t be loaded. Try again.'));
  }, [sid, cards, links, settings, scenarioList.map((s) => s.id).join()]);
  useEffect(() => { load(); }, [load]);
  if (scenarioList.length < 2) return html`<${Panel} title="Compare" onClose=${onClose}><p class="muted">You only have one scenario. Create a scenario from the menu next to the board name, change it, then compare it here.</p><//>`;
  const base = data && data[0];
  const moneyRow = (label, get) => html`<tr><td>${label}</td>${data.map((s, i) => { const v = get(s.m), b = get(base.m); return html`<td key=${s.id} class=${s.id === sid ? 'cur' : ''}>${v == null ? '—' : signed(v)}${i > 0 && v != null && b != null && Math.round(v - b) !== 0 ? html`<span class=${cls('d', tone(v - b))}>${signed(v - b)} vs first</span>` : null}</td>`; })}</tr>`;
  const plainMoney = (label, get) => html`<tr><td>${label}</td>${data.map((s, i) => { const v = get(s.m), b = get(base.m); return html`<td key=${s.id} class=${s.id === sid ? 'cur' : ''}>${v == null ? '—' : money(v)}${i > 0 && v != null && b != null && Math.round(v - b) !== 0 ? html`<span class=${cls('d', tone(v - b))}>${signed(v - b)} vs first</span>` : null}</td>`; })}</tr>`;
  const monthsRow = (label, get) => html`<tr><td>${label}</td>${data.map((s, i) => { const v = get(s.m), b = get(base.m); const txt = v === undefined ? '—' : v === null ? 'Never' : v === 0 ? 'Done' : monthLabel(v); const diff = i > 0 && v != null && b != null ? v - b : 0; return html`<td key=${s.id} class=${s.id === sid ? 'cur' : ''}>${txt}${diff ? html`<span class=${cls('d', diff < 0 ? 'pos' : 'neg')}>${diff < 0 ? plural(-diff, 'month') + ' sooner' : plural(diff, 'month') + ' later'}</span>` : null}</td>`; })}</tr>`;
  const keys = (k) => data ? Array.from(new Set(data.flatMap((s) => Object.keys(s.m[k])))) : [];
  return html`<${Panel} wide title="Compare scenarios" sub=${'Monthly figures and projections at ' + settings.horizon + ' months. Differences are against the first column.'} onClose=${onClose}>
    ${err ? html`<div class="warn"><${Icon} n="alert" s=${18} />${err}<button class="btn-sm" onClick=${load}>Try again</button></div>` : null}
    ${!data && !err ? html`<p class="muted">Loading scenarios…</p>` : null}
    ${data ? html`<div class="cmp-wrap"><table class="cmp">
      <thead><tr><th>Scenario</th>${data.map((s) => html`<th key=${s.id} class=${s.id === sid ? 'cur' : ''}>${s.name}<br />${s.id === sid ? html`<span class="eyebrow">Showing</span>` : html`<button class="btn-sm" onClick=${() => onSwitch(s.id)}>Open</button>`}</th>`)}</tr></thead>
      <tbody>
        <tr class="sec"><td colspan=${data.length + 1}>Each month</td></tr>
        ${moneyRow('Coming in', (m) => m.coming)}
        ${moneyRow('Going out', (m) => m.going)}
        ${moneyRow('Left over', (m) => m.net)}
        <tr><td>Saving into goals</td>${data.map((s) => html`<td key=${s.id} class=${s.id === sid ? 'cur' : ''}>${s.m.rate}%</td>`)}</tr>
        ${keys('accounts').length ? html`<tr class="sec"><td colspan=${data.length + 1}>Accounts in ${settings.horizon} months</td></tr>` : null}
        ${keys('accounts').map((k) => html`<${React.Fragment} key=${'a' + k}>${plainMoney(k, (m) => m.accounts[k] ?? null)}<//>`)}
        ${keys('goals').length ? html`<tr class="sec"><td colspan=${data.length + 1}>Goals reached</td></tr>` : null}
        ${keys('goals').map((k) => html`<${React.Fragment} key=${'g' + k}>${monthsRow(k, (m) => (k in m.goals ? m.goals[k] : undefined))}<//>`)}
        ${keys('debts').length ? html`<tr class="sec"><td colspan=${data.length + 1}>Debts paid off</td></tr>` : null}
        ${keys('debts').map((k) => html`<${React.Fragment} key=${'d' + k}>${monthsRow(k, (m) => (k in m.debts ? m.debts[k] : undefined))}<//>`)}
      </tbody></table></div>
      ${scenarioList.length > 4 ? html`<p class="muted">Showing the first 4 of ${scenarioList.length} scenarios.</p>` : null}
      <button class="btn-sm" style=${{ alignSelf: 'flex-start' }} onClick=${load}>Refresh</button>` : null}
  <//>`;
}

function ImportPanel({ onClose, onAdd, preload }) {
  const [text, setText] = useState(preload ? preload.text : null);
  const [fileName, setFileName] = useState(preload ? preload.name : '');
  const [err, setErr] = useState(null);
  const [over, setOver] = useState(false);
  const [map, setMap] = useState(null);
  const [result, setResult] = useState(null);
  const inputRef = useRef(null);
  const rows = useMemo(() => (text ? parseCSV(text) : null), [text]);
  useEffect(() => {
    if (!rows) return;
    if (rows.length < 2) { setErr('That file has no transactions in it.'); return; }
    let headerRow = rows.findIndex((r) => r.filter((c) => c && isNaN(parseAmount(c) ?? NaN) && !parseDate(c)).length >= 2);
    if (headerRow < 0 || headerRow > 10) headerRow = 0;
    const g = guessColumns(rows[headerRow]);
    const sample = rows.slice(headerRow + 1, headerRow + 60);
    let sign = 'negOut';
    if (g.amount >= 0) { const vals = sample.map((r) => parseAmount(r[g.amount])).filter((v) => v != null); const negs = vals.filter((v) => v < 0).length; if (vals.length && negs / vals.length < 0.1) sign = 'posOut'; }
    setMap({ headerRow, ...g, sign }); setErr(null); setResult(null);
  }, [rows]);
  useEffect(() => { if (preload) { setText(preload.text); setFileName(preload.name); } }, [preload]);
  const readFile = (f) => {
    if (!f) return;
    if (!/\.(csv|txt|tsv)$/i.test(f.name) && !/csv|text/.test(f.type)) { setErr(f.name + ' isn’t a CSV. Export your statement as CSV from your bank’s website.'); return; }
    if (f.size > 5 * 1048576) { setErr(f.name + ' is larger than 5 MB. Export a shorter date range.'); return; }
    const r = new FileReader();
    r.onload = () => { setFileName(f.name); setText(String(r.result || '')); };
    r.onerror = () => setErr(f.name + ' couldn’t be read. Try exporting it again.');
    r.readAsText(f);
  };
  const header = rows && map ? rows[map.headerRow] : [];
  const colSel = (key, label, optional) => html`<label for=${'map-' + key}>${label}</label>
    <${Select} id=${'map-' + key} label=${label} value=${map[key]}
      options=${(optional ? [{ value: -1, label: 'Not in this file' }] : []).concat(header.map((h, i) => ({ value: i, label: h || 'Column ' + (i + 1) })))}
      onChange=${(v) => { setMap({ ...map, [key]: Number(v) }); setResult(null); }} />`;
  const analyze = () => {
    if (map.date < 0) { setErr('Pick the column that holds the date.'); return; }
    if (map.amount < 0 && map.debit < 0 && map.credit < 0) { setErr('Pick the column that holds the amount, or the money in and money out columns.'); return; }
    const { txs, skipped } = buildTransactions(rows, map);
    if (txs.length < 5) { setErr('Only ' + txs.length + ' rows had a date and an amount. Check the columns above.'); return; }
    const a = analyzeStatement(txs);
    if (!a) { setErr('Every row looked like a transfer between accounts, so there was nothing to import.'); return; }
    setErr(null); setResult({ ...a, skipped });
  };
  const toggle = (group, id) => setResult({ ...result, [group]: result[group].map((x) => (x.id === id ? { ...x, on: !x.on } : x)) });
  const chosen = result ? ['income', 'recurring', 'spend'].reduce((n, k) => n + result[k].filter((x) => x.on).length, 0) : 0;
  const fmtDate = (d) => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const Group = ({ k, title, sub }) => result[k].length ? html`<section class="group"><div class="eyebrow">${title} · ${result[k].length}</div>${sub ? html`<p class="muted">${sub}</p>` : null}
    <div class="rv">${result[k].map((x) => html`<label key=${x.id} class="rv-row"><input type="checkbox" checked=${x.on} onChange=${() => toggle(k, x.id)} />
      <span class="n">${x.name}<small>${x.count ? plural(x.count, 'transaction') : 'Not regular'}${x.freq !== 'monthly' ? ' · ' + FREQ_LABEL[x.freq].toLowerCase() : ''}</small></span>
      <b>${money(x.amount)}${x.freq === 'monthly' ? '/mo' : ''}</b></label>`)}</div></section>` : null;
  return html`<${Panel} title="Import a statement" sub="Turn a bank or card CSV into cards. Review everything before it’s added." onClose=${onClose}>
    <p class="privacy"><${Icon} n="lock" s=${18} />Your statement is read in this browser. Only the totals you choose become cards. The transactions themselves aren’t saved or shared.</p>
    ${!text ? html`<div class=${cls('drop-mini', over && 'over')} onDragOver=${(e) => { e.preventDefault(); setOver(true); }} onDragLeave=${() => setOver(false)} onDrop=${(e) => { e.preventDefault(); setOver(false); readFile(e.dataTransfer.files[0]); }}>
        <${Icon} n="importIcon" s=${32} /><b>Drop a CSV statement</b><span class="muted">Most banks offer “Export” or “Download transactions” as CSV.</span>
        <button class="cta" style=${{ height: '48px' }} onClick=${() => inputRef.current.click()}>Choose a CSV file</button>
        <button class="btn-sm" onClick=${() => { setFileName('sample-statement.csv'); setText(sampleStatement()); }}>Try a sample statement</button>

        ${colSel('date', 'Date')}
        ${colSel('desc', 'Description', true)}

      <button class="cta" style=${{ height: '48px', alignSelf: 'flex-start' }} onClick=${analyze}>Find income, bills and spending</button>
    </section>` : null}
    ${result ? html`
      <div class="stats">
        <div class="stat"><span class="eyebrow">Transactions</span><b>${result.count}</b></div>
        <div class="stat"><span class="eyebrow">Months</span><b>${result.months.toFixed(1)}</b></div>
        <div class="stat"><span class="eyebrow">Transfers skipped</span><b>${result.transfers}</b></div>
      </div>
      <p class="muted">${fmtDate(result.from)} to ${fmtDate(result.to)}.${result.skipped ? ' ' + plural(result.skipped, 'row') + ' without a date or amount were skipped.' : ''} Amounts are monthly averages unless a schedule was found.</p>
      ${result.months < 1.5 ? html`<div class="warn"><${Icon} n="alert" s=${18} />This covers less than 2 months, so bills that repeat may not be spotted. Export 3 months or more if you can.</div>` : null}
      <${Group} k="income" title="Income" />
      <${Group} k="recurring" title="Recurring payments" sub="Charges that repeat at a steady amount. They become one Recurring payments card." />
      <${Group} k="spend" title="Spending" sub="Everything else, grouped by type. Each becomes a Spend card." />
      <div class="row-btns" style=${{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
        <button class="cta" style=${{ height: '48px' }} disabled=${!chosen} onClick=${() => onAdd(result)}>Add ${plural(chosen, 'item')} to the board</button>
        <button class="btn-sm" onClick=${() => setResult(null)}>Back to columns</button>
      </div>` : null}
  <//>`;
}

function ScenarioMenu({ sid, scenarioList, onSwitch, onCreate, onRename, onDelete, onCompare, onClose }) {
  const [mode, setMode] = useState(null);
  const cur = scenarioList.find((s) => s.id === sid) || scenarioList[0];
  const [name, setName] = useState('');
  const [err, setErr] = useState(null);
  const ref = useRef(null);
  useEffect(() => {
    const away = (e) => { if (ref.current && !ref.current.contains(e.target) && !e.target.closest('.scen-btn')) onClose(); };
    const key = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('pointerdown', away, true); window.addEventListener('keydown', key);
    return () => { document.removeEventListener('pointerdown', away, true); window.removeEventListener('keydown', key); };
  }, []);
  const check = (n, except) => {
    const t = n.trim();
    if (!t) return 'Give the scenario a name.';
    if (t.length > 40) return 'Keep the name under 40 characters.';
    if (scenarioList.some((s) => s.id !== except && s.name.trim().toLowerCase() === t.toLowerCase())) return 'There’s already a scenario with that name.';
    if (!except && scenarioList.length >= 8) return 'A board can have 8 scenarios. Delete one to add another.';
    return null;
  };
  const submit = (e) => {
    e.preventDefault();
    const why = check(name, mode === 'rename' ? sid : null);
    if (why) { setErr(why); return; }
    if (mode === 'new') onCreate(name.trim()); else onRename(name.trim());
    onClose();
  };
  return html`<div class="menu" ref=${ref} role="menu" aria-label="Scenarios">
    <div class="menu-title eyebrow">Scenarios</div>
    ${scenarioList.map((s) => html`<button key=${s.id} class="menu-item" role="menuitemradio" aria-checked=${s.id === sid} onClick=${() => { onSwitch(s.id); onClose(); }}>
      <span class="ck">${s.id === sid ? html`<${Icon} n="check" s=${18} w=${2.25} />` : null}</span><span class="grow">${s.name}</span></button>`)}
    <div class="menu-sep"></div>
    ${mode === 'new' || mode === 'rename' ? html`<form class="menu-form" onSubmit=${submit}>
        <label class="eyebrow" for="scen-name">${mode === 'new' ? 'Copy “' + cur.name + '” as' : 'Rename “' + cur.name + '”'}</label>
        <input id="scen-name" class=${cls('text-in', err && 'bad')} autoFocus=${true} value=${name} maxLength=${60} placeholder="What if we move?" onChange=${(e) => { setName(e.target.value); setErr(null); }} />
        ${err ? html`<span class="field-err" role="alert">${err}</span>` : null}
        <div class="row-btns"><button class="btn-sm primary" type="submit">${mode === 'new' ? 'Create scenario' : 'Rename'}</button><button class="btn-sm" type="button" onClick=${() => { setMode(null); setErr(null); }}>Cancel</button></div>
      </form>`
    : mode === null ? html`
      <button class="menu-item" onClick=${() => { setMode('new'); setName(''); }}><span class="ck"><${Icon} n="plus" s=${18} /></span><span class="grow">New scenario from “${cur.name}”</span></button>
      <button class="menu-item" onClick=${() => { onCompare(); onClose(); }}><span class="ck"><${Icon} n="compare" s=${18} /></span><span class="grow">Compare scenarios</span></button>
      <button class="menu-item" onClick=${() => { setMode('rename'); setName(cur.name); }}><span class="ck"><${Icon} n="pencil" s=${18} /></span><span class="grow">Rename “${cur.name}”</span></button>
      ${sid !== 'main' ? html`<button class="menu-item danger" onClick=${() => setMode('delete')}><span class="ck"><${Icon} n="trash" s=${18} /></span><span class="grow">Delete “${cur.name}”</span></button>` : null}` : null}
    ${mode === 'delete' ? html`<div class="menu-form"><div class="confirm"><p>Delete “${cur.name}” and all its cards for everyone? This can’t be undone.</p>
      <div class="row-btns"><button class="btn-sm danger" onClick=${() => { onDelete(); onClose(); }}>Delete scenario</button><button class="btn-sm" onClick=${() => setMode(null)}>Keep it</button></div></div></div>` : null}
  </div>`;
}

/* ---------- toast ---------- */
function Toast() {
  const [msg, setMsg] = useState(null);
  useEffect(() => {
    let t;
    const on = (e) => { setMsg(e.detail); clearTimeout(t); t = setTimeout(() => setMsg(null), 4200); };
    window.addEventListener('cf-toast', on);
    return () => window.removeEventListener('cf-toast', on);
  }, []);
  return msg ? html`<div class="toast" role="status">${msg.tag ? html`<span class="tag">${msg.tag}</span>` : null}<span>${msg.msg}</span></div>` : html`<div class="sr" role="status"></div>`;
}

/* ---------- app ---------- */
function App() {
  const [prefs, setPrefsState] = useState(loadPrefs);
  const setPrefs = (p) => setPrefsState((old) => { const n = { ...old, ...p }; try { localStorage.setItem(PREF_KEY, JSON.stringify(n)); } catch (e) {} return n; });
  const sid = prefs.sid || 'main';
  const store = useStore(sid);
  const { cards, links, meta, settings, scenarios, scenLoaded, mode, ready, raw, db } = store;
  useEffect(() => { if (scenLoaded && sid !== 'main' && !scenarios[sid]) { setPrefs({ sid: 'main' }); say('That scenario was deleted, so you\u2019re back on \u201c' + (meta.mainName || 'Current plan') + '\u201d.'); } }, [scenLoaded, scenarios, sid]);
  setCurrency(settings.currency);
  const presence = usePresence(sid);
  const whoRef = useRef(null); whoRef.current = presence.me;
  const activity = useActivity(db, sid, whoRef);
  const hist = useHistory(store, activity.log);
  const ops = hist.ops;

  const [view, setView] = useState({ x: 0, y: 0, k: 1 });
  const [tool, setTool] = useState('select');
  const [sel, setSel] = useState(null);
  const [drag, setDrag] = useState(null);
  const [wire, setWire] = useState(null);
  const [connectFrom, setConnectFrom] = useState(null);
  const [panning, setPanning] = useState(false);
  const [panel, setPanel] = useState(null);
  const [menu, setMenu] = useState(false);
  const [ghost, setGhost] = useState(null);
  const [pending, setPending] = useState([]);
  const [assets, setAssets] = useState(null);
  const [dropOver, setDropOver] = useState(false);
  const [importPreload, setImportPreload] = useState(null);
  const [a11yFocus, setA11yFocus] = useState(0);
  const [announcement, setAnnouncement] = useState('');
  const hostTheme = useRef(undefined);
  useEffect(() => {
    const r = document.documentElement;
    if (hostTheme.current === undefined) hostTheme.current = r.getAttribute('data-theme');
    const apply = () => {
      const want = prefs.theme === 'light' || prefs.theme === 'dark' ? prefs.theme : hostTheme.current;
      if ((r.getAttribute('data-theme') || null) !== (want || null)) { if (want) r.setAttribute('data-theme', want); else r.removeAttribute('data-theme'); }
    };
    apply();
    const flag = (k, on, v) => (on ? r.setAttribute(k, v) : r.removeAttribute(k));
    flag('data-contrast', prefs.contrast, 'high');
    flag('data-cb', prefs.cbSafe, 'safe');
    flag('data-motion', prefs.reduceMotion, 'reduce');
    flag('data-spacing', prefs.spacing, 'wide');
    flag('data-focus', prefs.focusStrong, 'strong');
    r.style.setProperty('--ui-zoom', String((prefs.textSize || 100) / 100));
    const mo = new MutationObserver(() => {
      const cur = r.getAttribute('data-theme');
      if (prefs.theme === 'system') { hostTheme.current = cur; return; }
      if (cur !== prefs.theme) { hostTheme.current = cur; r.setAttribute('data-theme', prefs.theme); }
    });
    mo.observe(r, { attributes: true, attributeFilter: ['data-theme'] });
    return () => mo.disconnect();
  }, [prefs.theme, prefs.contrast, prefs.cbSafe, prefs.reduceMotion, prefs.spacing, prefs.focusStrong, prefs.textSize]);

  const vp = useRef(null), fileRef = useRef(null);
  const viewRef = useRef(view); viewRef.current = view;
  const cardsRef = store.cardsRef, settingsRef = store.settingsRef;
  const dragRef = useRef(drag); dragRef.current = drag;
  const G = useRef({ pointers: {}, mode: null });
  const spaceDown = useRef(false);
  const addCount = useRef(0);
  const fitted = useRef(false);
  const quietUntil = useRef(0);
  const quiet = () => { quietUntil.current = Date.now() + 2500; };

  const flows = useMemo(() => computeFlows(cards, links), [cards, links]);
  const flowsRef = useRef(flows); flowsRef.current = flows;
  const checks = useMemo(() => computeChecks(cards, flows, settings), [cards, flows, settings]);
  const posOf = (id) => (drag && drag.id === id ? drag : cards[id]);

  const mainName = meta.mainName || 'Current plan';
  const scenarioList = [{ id: 'main', name: mainName }].concat(Object.values(scenarios).sort((a, b) => num(a.createdAt) - num(b.createdAt)));
  const scenarioNames = Object.fromEntries(scenarioList.map((s) => [s.id, s.name]));
  const scenarioName = scenarioNames[sid] || mainName;

  /* screen-reader announcements */
  const lastSaid = useRef(null);
  useEffect(() => {
    if (!ready) return;
    const t = setTimeout(() => {
      const probs = checks.list.filter((x) => x.level !== 'tip').length;
      const key = Math.round(flows.net) + '|' + probs;
      if (lastSaid.current !== null && lastSaid.current !== key && prefs.announce) {
        setAnnouncement('Left over per month is now ' + signed(flows.net) + '. ' + (probs ? plural(probs, 'problem') + ' to check.' : 'No problems.'));
      }
      lastSaid.current = key;
    }, 1500);
    return () => clearTimeout(t);
  }, [flows.net, checks, ready, prefs.announce]);

  /* automation: tell me about new problems */
  const seenChecks = useRef(null);
  useEffect(() => { seenChecks.current = null; }, [sid]);
  useEffect(() => {
    if (!ready) return;
    const t = setTimeout(() => {
      const keys = new Set(checks.list.filter((x) => x.level !== 'tip').map((x) => x.key));
      if (seenChecks.current && settingsRef.current.auto.notifyChecks && Date.now() > quietUntil.current) {
        const fresh = checks.list.find((x) => x.level !== 'tip' && !seenChecks.current.has(x.key));
        if (fresh) say(fresh.text, 'Check');
      }
      seenChecks.current = keys;
    }, 1200);
    return () => clearTimeout(t);
  }, [checks, ready]);

  useEffect(() => {
    const cl = window.claude;
    if (cl && typeof cl.use === 'function') cl.use('assets').then((a) => setAssets(a || null)).catch(() => {});
  }, []);

  const rect = () => vp.current.getBoundingClientRect();
  const toWorld = (cx, cy) => { const r = rect(), v = viewRef.current; return { x: (cx - r.left - v.x) / v.k, y: (cy - r.top - v.y) / v.k }; };
  const centerWorld = () => { const r = rect(); return toWorld(r.left + r.width / 2, r.top + r.height / 2); };
  const zoomAt = useCallback((f, cx, cy) => setView((v) => {
    const r = vp.current.getBoundingClientRect();
    const px = cx == null ? r.width / 2 : cx - r.left, py = cy == null ? r.height / 2 : cy - r.top;
    const k = clamp(v.k * f, 0.2, 2.5), s = k / v.k;
    return { k, x: px - (px - v.x) * s, y: py - (py - v.y) * s };
  }), []);
  const nodeOf = (id) => vp.current && vp.current.querySelector('.card[data-card="' + id + '"]');
  const fit = useCallback((only) => {
    const el = vp.current; if (!el) return;
    const r = el.getBoundingClientRect();
    let nodes = Array.from(el.querySelectorAll('.card[data-card]'));
    if (only) nodes = nodes.filter((n) => only.includes(n.dataset.card));
    if (!nodes.length) { setView({ x: r.width / 2, y: r.height / 2, k: 1 }); return; }
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    nodes.forEach((n) => { const c = cardsRef.current[n.dataset.card]; if (!c) return; x0 = Math.min(x0, c.x); y0 = Math.min(y0, c.y); x1 = Math.max(x1, c.x + n.offsetWidth); y1 = Math.max(y1, c.y + n.offsetHeight); });
    if (!Number.isFinite(x0)) return;
    const phone = r.width < 720;
    const L = phone ? 16 : 84, R = 16, T = phone ? 128 : 104, B = phone ? 100 : 72;
    const aw = r.width - L - R, ah = r.height - T - B;
    const k = clamp(Math.min(aw / (x1 - x0), ah / (y1 - y0)), phone ? 0.3 : 0.2, 1);
    setView({ k, x: L + (aw - (x1 - x0) * k) / 2 - x0 * k, y: T + Math.max(0, (ah - (y1 - y0) * k) / 2) - y0 * k });
  }, []);
  const focusCard = (id) => {
    const n = nodeOf(id), c = cardsRef.current[id]; if (!n || !c) return;
    const r = rect(), phone = r.width < 720;
    const k = clamp(Math.max(viewRef.current.k, 0.8), 0.3, 1);
    const cx = phone ? r.width / 2 : (r.width - (panel ? 424 : 0) + 72) / 2;
    const cy = phone ? r.height * 0.3 : r.height / 2;
    setView({ k, x: cx - (c.x + n.offsetWidth / 2) * k, y: cy - (c.y + Math.min(n.offsetHeight, 400) / 2) * k });
    setSel({ type: 'card', id });
    if (phone) setPanel(null);
  };

  useEffect(() => { if (ready && !fitted.current) { fitted.current = true; requestAnimationFrame(() => requestAnimationFrame(() => fit())); } }, [ready, fit]);

  useEffect(() => {
    const el = vp.current;
    const onWheel = (e) => {
      if (e.target.closest('textarea') && !e.ctrlKey) return;
      e.preventDefault();
      if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
      else setView((v) => ({ ...v, x: v.x - e.deltaX, y: v.y - e.deltaY }));
    };
    el.addEventListener('wheel', onWheel, { passive: false });
    return () => el.removeEventListener('wheel', onWheel);
  }, [zoomAt]);

  /* presence: what I'm pointing at, selecting and editing */
  useEffect(() => { presence.update({ sel: sel && sel.type === 'card' ? sel.id : null }); }, [sel, presence.update]);
  useEffect(() => {
    const el = vp.current;
    const fin = (e) => { const c = e.target.closest && e.target.closest('[data-card]'); presence.update({ edit: c ? c.dataset.card : null }); if (c && c.dataset.card && !(G.current && G.current.mode)) setSel((cur) => (cur && cur.type === 'card' && cur.id === c.dataset.card ? cur : { type: 'card', id: c.dataset.card })); };
    const fout = () => presence.update({ edit: null });
    el.addEventListener('focusin', fin); el.addEventListener('focusout', fout);
    return () => { el.removeEventListener('focusin', fin); el.removeEventListener('focusout', fout); };
  }, [presence.update]);
  const others = presence.peers.filter((p) => !p.isMe);
  const peerInfo = (p) => {
    const pr = p.presence || {};
    const name = presence.nameOf(typeof pr.who === 'string' ? pr.who : null) || 'Someone';
    return { name, color: [1, 2, 3, 4].includes(pr.color) ? pr.color : hashN(p.peer), pr };
  };
  const editors = {};
  others.forEach((p) => { const i = peerInfo(p); if (i.pr.sid === sid && typeof i.pr.edit === 'string') editors[i.pr.edit] = i; });

  /* links, with constraints */
  const linkRule = (from, to) => {
    const a = cardsRef.current[from], b = cardsRef.current[to];
    if (!a || !b || from === to) return 'skip';
    if (!portsFor(a).outPort) return cardName(a) + ' can’t send money on.' + (a.kind === 'account' ? ' CDs hold money until they mature.' : '');
    if (!portsFor(b).inPort) return cardName(b) + ' can’t take money in.' + (b.kind === 'account' ? ' CDs don’t accept deposits after they open.' : '');
    const f = flowsRef.current;
    if ((f.outgoing[from] || []).includes(to)) return 'Those cards are already linked.';
    if ((f.outgoing[to] || []).includes(from)) return 'Those cards are already linked the other way. Remove that link first.';
    if (wouldLoop(f.outgoing, from, to)) return 'That link would make a loop, so it wasn’t added.';
    if (b.kind !== 'split' && (f.outgoing[from] || []).some((t) => cardsRef.current[t] && cardsRef.current[t].kind !== 'split'))
      return cardName(a) + ' already sends its money to a card. Add a Split card to divide it.';
    return null;
  };
  const tryLink = (from, to) => {
    const why = linkRule(from, to);
    if (why) { if (why !== 'skip') say(why); return false; }
    ops.addLink({ id: uid('l'), from, to });
    return true;
  };

  /* adding cards runs the automations */
  const runAutomations = (c) => {
    const s = settingsRef.current, a = s.auto, all = { ...cardsRef.current, [c.id]: c };
    const acct = mainAccount(all, s), acctName = acct && cardName(all[acct]);
    const done = [];
    if (acct && a.linkOutflows && ['spend', 'recurring', 'debt'].includes(c.kind)) { ops.addLink({ id: uid('l'), from: c.id, to: acct }); done.push('linked it to ' + acctName); }
    if (c.kind === 'income') {
      if (a.payYourselfFirst) {
        let goal = Object.values(all).filter((x) => x.kind === 'goal').sort((p, q) => p.x - q.x)[0];
        if (!goal) { goal = { ...newCard('goal', c.x + 700, c.y + 240, s), title: 'Savings' }; ops.addCard(goal); }
        const sp = { ...newCard('split', c.x + KINDS.income.w + 80, c.y + 240, s), title: 'Pay yourself first', pct: s.savingsTarget };
        ops.addCard(sp);
        ops.addLink({ id: uid('l'), from: c.id, to: sp.id });
        ops.addLink({ id: uid('l'), from: sp.id, to: goal.id });
        done.push('sent ' + s.savingsTarget + '% to ' + cardName(goal));
      }
      if (acct && a.linkIncome) { ops.addLink({ id: uid('l'), from: c.id, to: acct }); done.push('linked it to ' + acctName); }
    }
    if (done.length) say('New ' + KINDS[c.kind].label.toLowerCase() + ': ' + done.join(' and ') + '.', 'Automation');
  };
  const addCardAt = (kind, at) => {
    quiet();
    const K = KINDS[kind];
    const c = newCard(kind, at.x - K.w / 2, at.y - 80, settingsRef.current);
    hist.tx('Added ' + cardName(c), () => { ops.addCard(c); runAutomations(c); });
    setSel({ type: 'card', id: c.id }); setTool('select');
    return c;
  };
  const addCardCenter = (kind) => {
    const n = addCount.current++ % 6, p = centerWorld();
    addCardAt(kind, { x: p.x + n * 28, y: p.y + n * 28 });
  };
  const boardOps = useMemo(() => ({
    ...ops,
    updateCard(id, patch) {
      const prev = cardsRef.current[id];
      ops.updateCard(id, patch);
      if (prev && prev.kind === 'goal' && settingsRef.current.auto.goalAlert) {
        const next = { ...prev, ...patch }, t = num(next.target);
        if (t > 0 && num(next.saved) >= t && num(prev.saved) < num(prev.target)) say(cardName(next) + ' reached its ' + money(t) + ' target.', 'Goal reached');
      }
    }
  }), [ops]);
  const duplicate = (id) => {
    const c = cardsRef.current[id]; if (!c) return;
    quiet();
    const copy = { ...JSON.parse(JSON.stringify(c)), id: uid('c'), x: c.x + 32, y: c.y + 32 };
    if (copy.title) copy.title = (copy.title + ' copy').slice(0, 60);
    ops.addCard(copy); setSel({ type: 'card', id: copy.id });
  };
  const removeSel = () => {
    if (!sel) return;
    if (sel.type === 'card') ops.removeCard(sel.id); else ops.removeLink(sel.id);
    setSel(null);
  };
  const placeRight = (newCards) => {
    const cs = Object.values(cardsRef.current);
    const tx0 = Math.min(...newCards.map((c) => c.x)), ty0 = Math.min(...newCards.map((c) => c.y));
    if (!cs.length) return { dx: -tx0, dy: -ty0 };
    return { dx: Math.max(...cs.map((c) => c.x + (KINDS[c.kind] ? KINDS[c.kind].w : 260))) + 240 - tx0, dy: Math.min(...cs.map((c) => c.y)) - ty0 };
  };
  const addTemplate = (t) => {
    quiet();
    const wasEmpty = !Object.keys(cardsRef.current).length;
    const { dx, dy } = placeRight(materialize(t, 0, 0, settingsRef.current).cards);
    const b = materialize(t, dx, dy, settingsRef.current);
    hist.tx('Added the “' + t.name + '” template', () => {
      b.cards.forEach((c) => ops.addCard(c));
      b.links.forEach((l) => ops.addLink(l));
      if (wasEmpty && sid === 'main' && (!meta.title || meta.title === 'Household budget' || meta.title === 'Untitled board')) ops.setTitle(t.name);
    });
    say('Added “' + t.name + '” to the board.');
    if (rect().width < 720) setPanel(null);
    const ids = b.cards.map((c) => c.id);
    requestAnimationFrame(() => requestAnimationFrame(() => fit(ids)));
  };
  const addImport = (r) => {
    quiet();
    const s = settingsRef.current;
    const inc = r.income.filter((x) => x.on), rec = r.recurring.filter((x) => x.on), sp = r.spend.filter((x) => x.on);
    const newCards = [], newLinks = [];
    let y = 0;
    inc.forEach((x) => { newCards.push({ ...newCard('income', 0, y, s), title: x.name.slice(0, 60), amount: x.amount, freq: x.freq }); y += 260; });
    if (rec.length) { newCards.push({ ...newCard('recurring', -48, y, s), title: 'Bills from statement', items: rec.slice(0, 30).map((x) => ({ id: uid('i'), name: x.name.slice(0, 40), amount: x.amount, freq: x.freq })) }); y += 120 + rec.length * 42 + 140; }
    sp.forEach((x) => { newCards.push({ ...newCard('spend', 0, y, s), title: x.name, amount: x.amount, freq: 'monthly' }); y += 260; });
    let acct = mainAccount(cardsRef.current, s);
    let acctCard = null;
    if (!acct) { acctCard = { ...newCard('account', 500, 0, s), title: 'Checking' }; newCards.push(acctCard); acct = acctCard.id; }
    const { dx, dy } = placeRight(newCards.filter((c) => c !== acctCard));
    newCards.forEach((c) => { c.x += dx; c.y += dy; });
    newCards.filter((c) => c !== acctCard).forEach((c) => newLinks.push({ id: uid('l'), from: c.id, to: acct }));
    hist.tx('Imported ' + plural(inc.length + rec.length + sp.length, 'item') + ' from a statement', () => {
      newCards.forEach((c) => ops.addCard(c));
      newLinks.forEach((l) => ops.addLink(l));
    });
    say('Added ' + plural(newCards.length, 'card') + ' from your statement' + (acctCard ? ' and a Checking account for them.' : ', linked to ' + cardName(cardsRef.current[acct]) + '.'));
    setPanel(null); setImportPreload(null);
    const ids = newCards.map((c) => c.id);
    requestAnimationFrame(() => requestAnimationFrame(() => fit(ids)));
  };
  const openImportFromFile = (src, name) => {
    fetch(src).then((r) => { if (!r.ok) throw new Error(); return r.text(); })
      .then((text) => { setImportPreload({ text, name }); setPanel('import'); })
      .catch(() => say(name + ' couldn’t be opened. Try uploading it again.'));
  };
  const arrange = () => {
    quiet();
    const all = cardsRef.current, f = flowsRef.current;
    const flowCards = Object.values(all).filter((c) => KINDS[c.kind] && ((f.inputs[c.id] || []).length || (f.outgoing[c.id] || []).length));
    const loose = Object.values(all).filter((c) => KINDS[c.kind] && !flowCards.includes(c));
    const depth = {}, busy = {};
    const d = (id) => { if (depth[id] != null) return depth[id]; if (busy[id]) return 0; busy[id] = true; const v = Math.max(-1, ...(f.inputs[id] || []).map(d)) + 1; busy[id] = false; depth[id] = v; return v; };
    flowCards.forEach((c) => d(c.id));
    const layers = [];
    flowCards.forEach((c) => { (layers[depth[c.id]] = layers[depth[c.id]] || []).push(c); });
    const x0 = Math.min(0, ...Object.values(all).map((c) => c.x)), y0 = Math.min(...Object.values(all).map((c) => c.y).concat([0]));
    let x = x0, maxY = y0;
    const h = (c) => { const n = nodeOf(c.id); return n ? n.offsetHeight : 280; };
    hist.tx('Arranged the cards by flow', () => {
      layers.forEach((layer) => {
        if (!layer) return;
        layer.sort((a, b) => a.y - b.y);
        let y = y0, w = 0;
        layer.forEach((c) => { ops.updateCard(c.id, { x: Math.round(x), y: Math.round(y) }); y += h(c) + 48; w = Math.max(w, KINDS[c.kind].w); });
        maxY = Math.max(maxY, y); x += w + 140;
      });
      let lx = x0;
      loose.forEach((c) => { ops.updateCard(c.id, { x: Math.round(lx), y: Math.round(maxY + 60) }); lx += KINDS[c.kind].w + 48; });
    });
    say('Arranged ' + plural(flowCards.length + loose.length, 'card') + ' by how money flows.', 'Automation');
    requestAnimationFrame(() => requestAnimationFrame(() => fit()));
  };
  const clearBoard = () => {
    quiet();
    hist.tx('Cleared “' + scenarioName + '”', () => Object.keys(cardsRef.current).forEach((id) => ops.removeCard(id)));
    setSel(null); say('The cards were deleted. Undo brings them back.');
  };
  const applyFix = (fx) => {
    if (fx.type === 'link') { if (tryLink(fx.from, fx.to)) say('Linked.'); }
    else if (fx.type === 'patch') { boardOps.updateCard(fx.id, fx.patch); say('Updated.'); }
  };

  /* scenarios */
  const switchScenario = (id) => {
    if (id === sid) return;
    hist.clear(); setSel(null); setDrag(null); setWire(null); setConnectFrom(null);
    setPrefs({ sid: id });
    say('Showing “' + (scenarioNames[id] || 'scenario') + '”.');
  };
  const createScenario = async (name) => {
    try {
      const id = await raw.createScenario(name, cardsRef.current, store.linksRef.current, sid);
      activity.log('Created the scenario “' + name + '” from “' + scenarioName + '”');
      hist.clear(); setSel(null); setPrefs({ sid: id });
      say('Created “' + name + '”. Changes here don’t affect “' + scenarioName + '”.');
    } catch (e) { say(dbMessage(e)); }
  };
  const renameScenario = (name) => { raw.renameScenario(sid, name); activity.log('Renamed the scenario “' + scenarioName + '” to “' + name + '”'); };
  const deleteScenario = async () => {
    const name = scenarioName, id = sid;
    switchScenario('main');
    try { await raw.deleteScenario(id); activity.log('Deleted the scenario “' + name + '”'); say('Deleted “' + name + '”.'); } catch (e) { say(dbMessage(e)); }
  };

  async function uploadFiles(list, at) {
    const files = Array.from(list || []);
    if (!files.length) return;
    if (!assets) { say('File upload isn’t available in this view.'); return; }
    files.forEach(async (f, i) => {
      const pid = uid('p');
      const p = { id: pid, name: f.name, size: f.size, x: Math.round(at.x - 128 + i * 28), y: Math.round(at.y - 60 + i * 28) };
      setPending((l) => l.concat([p]));
      try {
        const ext = (f.name.split('.').pop() || '').toLowerCase();
        const type = TYPE_BY_EXT[ext] || f.type;
        const r = await assets.upload(f, type ? { type } : undefined);
        const c = { id: uid('c'), kind: 'file', x: p.x, y: p.y, name: f.name.slice(0, 160), size: r.sizeBytes || f.size, type: r.contentType, assetId: r.id };
        ops.addCard(c); setSel({ type: 'card', id: c.id });
      } catch (err) { say(uploadMessage(err, f.name)); }
      finally { setPending((l) => l.filter((x) => x.id !== pid)); }
    });
  }

  /* pointer handling */
  function onPointerDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0 && e.button !== 1) return;
    const g = G.current, el = vp.current, t = e.target;
    const port = t.closest('[data-port="out"]');
    const cardEl = t.closest('[data-card]');
    const cid = cardEl && cardEl.dataset.card;
    const linkEl = t.closest('[data-link]');
    if (connectFrom) { if (cid && cid !== connectFrom) tryLink(connectFrom, cid); setConnectFrom(null); if (cid) return; }
    if (t.closest('input,textarea,select,button,a,label,.tip') && !port) { if (cid) setSel({ type: 'card', id: cid }); return; }
    if (document.activeElement && document.activeElement !== document.body && el.contains(document.activeElement)) document.activeElement.blur();
    g.pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    const ids = Object.keys(g.pointers);
    if (ids.length === 2) {
      const a = g.pointers[ids[0]], b = g.pointers[ids[1]];
      g.mode = 'pinch'; g.dist = Math.hypot(a.x - b.x, a.y - b.y); g.mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      setDrag(null); setWire(null);
      return;
    }
    const panTool = tool === 'hand' || e.button === 1 || spaceDown.current;
    if (port && !panTool) {
      const w = toWorld(e.clientX, e.clientY);
      g.mode = 'wire'; g.from = port.dataset.card;
      setWire({ from: g.from, x: w.x, y: w.y, over: null }); setSel({ type: 'card', id: g.from });
      return;
    }
    if (linkEl && !panTool) { setSel({ type: 'link', id: linkEl.dataset.link }); delete g.pointers[e.pointerId]; return; }
    if (cid && !panTool) {
      const c = cardsRef.current[cid]; if (!c) return;
      setSel({ type: 'card', id: cid });
      g.mode = 'drag'; g.id = cid; g.start = { x: e.clientX, y: e.clientY }; g.orig = { x: c.x, y: c.y }; g.moved = false;
      return;
    }
    setSel(null);
    g.mode = 'pan'; g.start = { x: e.clientX, y: e.clientY }; g.orig = { x: viewRef.current.x, y: viewRef.current.y };
    setPanning(true);
  }
  function onPointerMove(e) {
    const g = G.current;
    if (e.pointerType === 'mouse' || g.pointers[e.pointerId]) { const w = toWorld(e.clientX, e.clientY); presence.update({ cx: Math.round(w.x), cy: Math.round(w.y) }); }
    if (!g.pointers[e.pointerId]) return;
    g.pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (g.mode === 'pinch') {
      const ids = Object.keys(g.pointers); if (ids.length < 2) return;
      const a = g.pointers[ids[0]], b = g.pointers[ids[1]];
      const d = Math.hypot(a.x - b.x, a.y - b.y), m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      const dx = m.x - g.mid.x, dy = m.y - g.mid.y;
      zoomAt(d / g.dist, m.x, m.y);
      setView((v) => ({ ...v, x: v.x + dx, y: v.y + dy }));
      g.dist = d; g.mid = m;
    } else if (g.mode === 'pan') {
      setView((v) => ({ ...v, x: g.orig.x + e.clientX - g.start.x, y: g.orig.y + e.clientY - g.start.y }));
    } else if (g.mode === 'drag') {
      const k = viewRef.current.k, dx = e.clientX - g.start.x, dy = e.clientY - g.start.y;
      if (!g.moved && Math.hypot(dx, dy) < 4) return;
      g.moved = true;
      setDrag({ id: g.id, x: g.orig.x + dx / k, y: g.orig.y + dy / k });
    } else if (g.mode === 'wire') {
      const w = toWorld(e.clientX, e.clientY);
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const over = under && under.closest('[data-card]');
      setWire((v) => v && { ...v, x: w.x, y: w.y, over: over && over.dataset.card !== v.from ? over.dataset.card : null });
    }
  }
  function onPointerUp(e) {
    const g = G.current;
    if (!g.pointers[e.pointerId]) return;
    delete g.pointers[e.pointerId];
    if (g.mode === 'drag' && g.moved && dragRef.current) {
      const d = dragRef.current;
      ops.updateCard(d.id, { x: Math.round(d.x), y: Math.round(d.y) });
      setDrag(null);
    }
    if (g.mode === 'wire') {
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const to = under && under.closest('[data-card]');
      if (to && to.dataset.card !== g.from) tryLink(g.from, to.dataset.card);
      setWire(null);
    }
    if (!Object.keys(g.pointers).length) { g.mode = null; setPanning(false); }
    else if (g.mode === 'pinch') g.mode = null;
  }

  function paletteDown(kind, e) {
    if (e.button && e.button !== 0) return;
    const start = { x: e.clientX, y: e.clientY };
    let moved = false;
    const move = (ev) => {
      if (!moved && Math.hypot(ev.clientX - start.x, ev.clientY - start.y) < 6) return;
      moved = true; setGhost({ kind, x: ev.clientX, y: ev.clientY });
    };
    const up = (ev) => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      setGhost(null);
      if (!moved) { addCardCenter(kind); return; }
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      if (under && vp.current.contains(under)) addCardAt(kind, toWorld(ev.clientX, ev.clientY));
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  }

  useEffect(() => {
    const down = (e) => {
      const typing = e.target.closest && e.target.closest('input,textarea,select,[contenteditable="true"],[role="listbox"],.sel-pop');
      if (e.key === ' ' && !typing && !(e.target.closest && e.target.closest('button'))) { spaceDown.current = true; e.preventDefault(); return; }
      if (typing) return;
      const k = e.key, mod = e.metaKey || e.ctrlKey;
      if (mod && (k === 'z' || k === 'Z')) { e.preventDefault(); if (e.shiftKey) hist.redo(); else hist.undo(); return; }
      if (mod && (k === 'y' || k === 'Y')) { e.preventDefault(); hist.redo(); return; }
      if (mod && (k === 'd' || k === 'D')) { if (sel && sel.type === 'card') { e.preventDefault(); duplicate(sel.id); } return; }
      if (mod || e.altKey) return;
      if (k === '?') { e.preventDefault(); setPanel('settings'); setA11yFocus((n) => n + 1); return; }
      if (k === 'Delete' || k === 'Backspace') { if (sel) { e.preventDefault(); removeSel(); } }
      else if (k === 'Escape') { setSel(null); setConnectFrom(null); setTool('select'); }
      else if (k === '+' || k === '=') zoomAt(1.2);
      else if (k === '-' || k === '_') zoomAt(1 / 1.2);
      else if (k === '0') fit();
      else if (k === 'v' || k === 'V') setTool('select');
      else if (k === 'h' || k === 'H') setTool('hand');
      else if (k.indexOf('Arrow') === 0) {
        const s = e.shiftKey ? 200 : 60;
        setView((v) => ({ ...v, x: v.x + (k === 'ArrowLeft' ? s : k === 'ArrowRight' ? -s : 0), y: v.y + (k === 'ArrowUp' ? s : k === 'ArrowDown' ? -s : 0) }));
      }
    };
    const upKey = (e) => { if (e.key === ' ') spaceDown.current = false; };
    window.addEventListener('keydown', down); window.addEventListener('keyup', upKey);
    return () => { window.removeEventListener('keydown', down); window.removeEventListener('keyup', upKey); };
  });

  const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  const closePanel = useCallback(() => { setPanel(null); setImportPreload(null); }, []);

  /* ---------- render ---------- */
  const cardList = Object.values(cards).filter((c) => KINDS[c.kind] && Number.isFinite(c.x) && Number.isFinite(c.y));
  const linkList = Object.values(links).filter((l) => cards[l.from] && cards[l.to]);
  const selCard = sel && sel.type === 'card' ? cards[sel.id] : null;
  const grid = 24 * view.k;
  const empty = ready && cardList.length === 0 && pending.length === 0;
  const wireFrom = wire && cards[wire.from];
  const worst = checks.list.length ? checks.list[0].level : null;
  const problemCount = checks.list.filter((x) => x.level !== 'tip').length;
  const problems = checks.list.filter((x) => x.level !== 'tip').length;
  const togglePanel = (p) => setPanel((cur) => (cur === p ? null : p));
  const pk = hist.peek();
  const avatars = [];
  const seenWho = new Set();
  others.forEach((p) => { const i = peerInfo(p); const key = (i.pr.who || p.peer); if (seenWho.has(key)) return; seenWho.add(key); avatars.push({ ...i, key, where: i.pr.sid !== sid ? (scenarioNames[i.pr.sid] || 'another scenario') : null }); });

  return html`<${PrefsCtx.Provider} value=${prefs}>
  <div ref=${vp} class=${cls('vp', tool === 'hand' && 'hand', panning && 'panning', (wire || connectFrom) && 'wiring')}
    style=${{ backgroundSize: grid + 'px ' + grid + 'px', backgroundPosition: view.x + 'px ' + view.y + 'px' }}
    tabIndex="-1" role="application" aria-label="Budget canvas. Drag the ground to pan, pinch or Ctrl and scroll to zoom. Drag from a card's right dot to another card to link them."
    onPointerDown=${onPointerDown} onPointerMove=${onPointerMove} onPointerUp=${onPointerUp} onPointerCancel=${onPointerUp}
    onPointerLeave=${() => presence.update({ cx: null, cy: null })}
    onDragOver=${(e) => { if (!hasFiles(e)) return; e.preventDefault(); if (!dropOver) setDropOver(true); }}
    onDragLeave=${(e) => { if (!e.currentTarget.contains(e.relatedTarget)) setDropOver(false); }}
    onDrop=${(e) => { if (!hasFiles(e)) return; e.preventDefault(); setDropOver(false); uploadFiles(e.dataTransfer.files, toWorld(e.clientX, e.clientY)); }}>
    <div class="world" style=${{ transform: `translate(${view.x}px,${view.y}px) scale(${view.k})` }}>
      <svg class="links" aria-hidden="true">
        ${linkList.map((l) => {
          const a = portOut(cards[l.from], posOf(l.from)), b = portIn(posOf(l.to)), cv = curve(a, b);
          const on = sel && sel.type === 'link' && sel.id === l.id;
          return html`<g key=${l.id} class=${cls('link', on && 'on')}>
            <path class="link-hit" data-link=${l.id} d=${cv.d} />
            <path class="link-line" d=${cv.d} />
            <path class="link-arrow" d=${`M${b.x - 10},${b.y - 6} L${b.x},${b.y} L${b.x - 10},${b.y + 6} Z`} />
          </g>`;
        })}
        ${wire && wireFrom ? html`<path class="wire" d=${curve(portOut(wireFrom, posOf(wire.from)), { x: wire.x + 8, y: wire.y }).d} />` : null}
      </svg>
      ${cardList.map((c) => { const p = posOf(c.id); return html`<${Card} key=${c.id} c=${c} cards=${cards} x=${p.x} y=${p.y} flows=${flows} settings=${settings} ops=${boardOps}
          badge=${checks.byCard[c.id]} onBadge=${(id) => { setSel({ type: 'card', id }); setPanel('checks'); }} editor=${editors[c.id]} onImport=${openImportFromFile}
          selected=${sel && sel.type === 'card' && sel.id === c.id} hot=${wire && wire.over === c.id} lifted=${drag && drag.id === c.id} />`; })}
      ${pending.map((p) => html`<div key=${p.id} class="card k-file pending" style=${{ left: p.x, top: p.y, width: KINDS.file.w }}>
          <div class="card-head"><span class="kind"><${Icon} n="upload" /></span><div class="head-text"><span class="eyebrow">Uploading</span><span class="title-input">${p.name}</span></div></div>
          <div class="card-body"><div class="bar" role="progressbar" aria-label=${'Uploading ' + p.name}><span></span></div><div class="file-meta">${fmtBytes(p.size)}</div></div>
        </div>`)}
      ${linkList.map((l) => {
        const on = sel && sel.type === 'link' && sel.id === l.id;
        if (!prefs.showAmounts && !on) return null;
        const a = portOut(cards[l.from], posOf(l.from)), b = portIn(posOf(l.to)), mid = curve(a, b).mid;
        const v = flows.linkValue(l.from, l.to) || 0;
        return html`<div key=${'t' + l.id} class=${cls('link-tag', on && 'on', !on && 'no-x')} data-link=${l.id} style=${{ left: mid.x, top: mid.y }}>
          <span class=${tone(v)}>${signed(v)}</span>
          ${on ? html`<button aria-label="Remove link" onClick=${() => { ops.removeLink(l.id); setSel(null); }}><${Icon} n="x" s=${14} w=${2} /></button>` : null}
        </div>`;
      })}
      ${prefs.hideCursors ? null : others.map((p) => { const i = peerInfo(p); if (i.pr.sid !== sid || typeof i.pr.cx !== 'number' || typeof i.pr.cy !== 'number') return null;
        return html`<div key=${p.peer} class="cursor" style=${{ left: i.pr.cx, top: i.pr.cy, transform: 'scale(' + (1 / view.k) + ')' }} aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" class=${'f' + i.color}><path d=${P.cursor} /></svg><span class=${'cursor-tag p' + i.color}>${i.name}</span></div>`; })}
      ${selCard && !drag && !wire ? html`<div class="ctx-anchor" style=${{ left: posOf(selCard.id).x, top: posOf(selCard.id).y - 12 / view.k }}>
        <div class="ctx" style=${{ transform: `scale(${1 / view.k})` }}>
          ${portsFor(selCard).outPort ? html`<button onClick=${() => { setConnectFrom(selCard.id); setSel(null); }}><${Icon} n="link" s=${18} />Link to…</button>` : null}
          <button onClick=${() => duplicate(selCard.id)}><${Icon} n="copy" s=${18} />Duplicate</button>
          <button class="danger" onClick=${removeSel}><${Icon} n="trash" s=${18} />Delete</button>
        </div></div>` : null}
    </div>
  </div>

  <div class="top">
    <div class="board-wrap">
      <div class="pill board">
        <span class="wordmark">Collabfin</span><span class="divider"></span>
        <${TextInput} className="board-title" required label="Board name" value=${meta.title} onCommit=${(v) => ops.setTitle(v)} />
        <button class="scen-btn" aria-haspopup="menu" aria-expanded=${menu} onClick=${() => setMenu(!menu)} title="Scenarios"><${Icon} n="layers" s=${16} /><span>${scenarioName}</span><${Icon} n="chevron" s=${16} /></button>
        ${mode !== 'loading' ? html`<span class=${cls('status', mode === 'local' && 'local')} title=${mode === 'shared' ? 'Everyone with access sees changes live' : 'Changes are saved in this browser only'}><i></i><span>${mode === 'shared' ? 'Live' : 'This browser'}</span></span>` : null}
        ${avatars.length ? html`<div class="peers" aria-label=${plural(avatars.length, 'other person') + ' here'}>${avatars.slice(0, 3).map((a) => html`<span key=${a.key} class=${'av p' + a.color} title=${a.name + (a.where ? ', viewing ' + a.where : '')}>${initials(a.name)}</span>`)}${avatars.length > 3 ? html`<span class="av more">+${avatars.length - 3}</span>` : null}</div>` : null}
      </div>
      ${menu ? html`<${ScenarioMenu} sid=${sid} scenarioList=${scenarioList} onSwitch=${switchScenario} onCreate=${createScenario} onRename=${renameScenario} onDelete=${deleteScenario} onCompare=${() => setPanel('compare')} onClose=${() => setMenu(false)} />` : null}
    </div>
    <div class="pill actions-pill">
      <button class="top-btn undo-top" disabled=${!pk.undo} title=${pk.undo ? 'Undo: ' + pk.undo.label + ' (Ctrl or Cmd+Z)' : 'Nothing to undo'} aria-label="Undo" onClick=${hist.undo}><${Icon} n="undo" /></button>
      <button class="top-btn undo-top" disabled=${!pk.redo} title=${pk.redo ? 'Redo: ' + pk.redo.label : 'Nothing to redo'} aria-label="Redo" onClick=${hist.redo}><${Icon} n="redo" /></button>
      <button class=${cls('top-btn', panel === 'history' && 'on')} aria-label="History" onClick=${() => togglePanel('history')}><${Icon} n="clock" /><span class="lbl">History</span></button>
      <button class=${cls('top-btn', panel === 'checks' && 'on')} aria-label=${'Checks, ' + (problems ? plural(problems, 'problem') : 'no problems')} onClick=${() => togglePanel('checks')}>
        <${Icon} n="shield" /><span class="lbl">Checks</span>
        <span class=${cls('count', problems ? 'lv-' + worst : checks.list.length ? 'lv-tip' : 'ok')}>${problems || (checks.list.length ? checks.list.length : '✓')}</span></button>
      <button class=${cls('top-btn', panel === 'templates' && 'on')} onClick=${() => togglePanel('templates')} aria-label="Templates"><${Icon} n="grid" /><span class="lbl">Templates</span></button>
      <button class=${cls('top-btn', panel === 'settings' && 'on')} onClick=${() => togglePanel('settings')} aria-label="Settings"><${Icon} n="sliders" /><span class="lbl">Settings</span></button>
    </div>
    <span class="spacer"></span>
    <div class="summary" aria-label="Monthly summary">
      <div class="sum-item"><span class="eyebrow">Coming in</span><span class="sum-fig pos">${signed(flows.coming)}</span></div>
      <div class="sum-item"><span class="eyebrow">Going out</span><span class="sum-fig neg">${signed(flows.going)}</span></div>
      <div class="sum-item net"><span class="eyebrow">Left over / mo<${Info} label="Left over" side="right" text=${'Coming in minus going out, per month. Money moved into goals still counts as left over. You’re saving ' + (flows.coming > 0 ? Math.round(flows.goalIn / flows.coming * 100) : 0) + '% of income into goals, against a target of ' + settings.savingsTarget + '%.'} /></span><span class=${cls('sum-fig', tone(flows.net))}>${signed(flows.net)}</span></div>
    </div>
  </div>

  <nav class="rail" aria-label="Canvas tools">
    <button class=${cls('tool', tool === 'select' && 'on')} data-tip="Select (V)" aria-label="Select" aria-pressed=${tool === 'select'} onClick=${() => setTool('select')}><${Icon} n="cursor" /></button>
    <button class=${cls('tool', tool === 'hand' && 'on')} data-tip="Pan (H or hold Space)" aria-label="Pan" aria-pressed=${tool === 'hand'} onClick=${() => setTool('hand')}><${Icon} n="hand" /></button>
    <div class="rail-sep"></div>
    ${PALETTE.map((k) => html`<button key=${k} class="tool" data-tip=${'Add ' + KINDS[k].label.toLowerCase() + ' (drag or click)'} aria-label=${'Add ' + KINDS[k].label} onPointerDown=${(e) => paletteDown(k, e)} onKeyDown=${(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); addCardCenter(k); } }}><span class=${'pal pal-' + k}><${Icon} n=${k} s=${18} /></span></button>`)}
    <div class="rail-sep"></div>
    <button class="tool" data-tip="Import a bank statement" aria-label="Import a bank statement" onClick=${() => setPanel('import')}><${Icon} n="importIcon" /></button>
    <button class="tool" data-tip="Arrange cards by flow" aria-label="Arrange cards by flow" onClick=${arrange}><${Icon} n="arrange" /></button>
    ${assets ? html`<button class="tool upload" data-tip="Upload files" aria-label="Upload files" onClick=${() => fileRef.current.click()}><${Icon} n="upload" /></button>` : null}
  </nav>

  <div class="zoombar">
    <button class="tool" aria-label="Zoom out" onClick=${() => zoomAt(1 / 1.2)}><${Icon} n="minus" /></button>
    <button class="zoom-pct" aria-label="Fit to content" title="Fit to content (0)" onClick=${() => fit()}>${Math.round(view.k * 100)}%</button>
    <button class="tool" aria-label="Zoom in" onClick=${() => zoomAt(1.2)}><${Icon} n="plus" /></button>
  </div>

  <div class="dock">
    <button class="tool" aria-label="Undo" disabled=${!pk.undo} onClick=${hist.undo}><${Icon} n="undo" /></button>
    <button class="cta" onClick=${() => setPanel('add')}><${Icon} n="plus" s=${22} />Add card</button>
    <button class=${cls('tool', tool === 'hand' && 'on')} aria-label="Pan mode" aria-pressed=${tool === 'hand'} onClick=${() => setTool(tool === 'hand' ? 'select' : 'hand')}><${Icon} n="hand" /></button>
    <button class="tool" aria-label="Fit to content" onClick=${() => fit()}><${Icon} n="fit" /></button>
  </div>

  ${panel === 'add' ? html`<${Panel} title="Add a card" sub="Link cards together to see where your money goes each month." onClose=${closePanel}>
      <div class="sheet-grid">
        ${PALETTE.map((k) => html`<button key=${k} class="pal-item" onClick=${() => { addCardCenter(k); setPanel(null); }}>
          <span class=${'pal pal-' + k}><${Icon} n=${k} /></span><b>${KINDS[k].label}</b><span>${KINDS[k].desc}</span></button>`)}
      </div>
      <div style=${{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
        <button class="btn-sm" onClick=${() => setPanel('import')}><${Icon} n="importIcon" s=${16} />Import a statement</button>
        <button class="btn-sm" onClick=${() => setPanel('templates')}><${Icon} n="grid" s=${16} />Browse templates</button>
        ${assets ? html`<button class="btn-sm" onClick=${() => { setPanel(null); fileRef.current.click(); }}><${Icon} n="upload" s=${16} />Upload a file</button>` : null}
      </div>
    <//>` : null}
  ${panel === 'checks' ? html`<${ChecksPanel} checks=${checks} cards=${cards} onClose=${closePanel} onShow=${focusCard} onFix=${applyFix} />` : null}
  ${panel === 'templates' ? html`<${TemplatesPanel} onClose=${closePanel} onAdd=${addTemplate} onImport=${() => setPanel('import')} />` : null}
  ${panel === 'settings' ? html`<${SettingsPanel} settings=${settings} cards=${cards} prefs=${prefs} setPrefs=${setPrefs} ops=${ops} onClose=${closePanel} onArrange=${arrange} onClear=${clearBoard} scenarioName=${scenarioName} focusA11y=${a11yFocus} />` : null}
  ${panel === 'history' ? html`<${HistoryPanel} entries=${activity.entries} onClose=${closePanel} hist=${hist} nameOf=${presence.nameOf} me=${presence.me} scenarioNames=${scenarioNames} mode=${mode} />` : null}
  ${panel === 'compare' ? html`<${ComparePanel} onClose=${closePanel} raw=${raw} sid=${sid} cards=${cards} links=${links} settings=${settings} scenarioList=${scenarioList} onSwitch=${switchScenario} />` : null}
  ${panel === 'import' ? html`<${ImportPanel} onClose=${closePanel} onAdd=${addImport} preload=${importPreload} />` : null}

  ${empty && !panel ? html`<div class="empty">
      <span class="eyebrow">${sid === 'main' ? 'New board' : 'Empty scenario'}</span>
      <h1>Map where your money goes.</h1>
      <p>Add income, bills and spending as cards, then link them into your accounts. Totals update as you edit, for everyone on the board.</p>
      <div class="actions">
        <button class="cta" onClick=${() => setPanel('templates')}><${Icon} n="grid" s=${22} />Choose a template</button>
        <button class="btn2" onClick=${() => setPanel('import')}><${Icon} n="importIcon" />Import a statement</button>
      </div>
    </div>` : null}

  ${connectFrom && cards[connectFrom] ? html`<div class="banner" role="status">Tap a card to send ${cardName(cards[connectFrom])} there<button onClick=${() => setConnectFrom(null)}>Cancel</button></div>` : null}
  ${dropOver ? html`<div class="dropzone"><${Icon} n="upload" s=${32} />${assets ? 'Drop to place on the board' : 'File upload isn’t available here'}</div>` : null}
  ${ghost ? html`<div class="ghost" style=${{ left: ghost.x, top: ghost.y }}><span class=${'pal pal-' + ghost.kind}><${Icon} n=${ghost.kind} s=${16} /></span>${KINDS[ghost.kind].label}</div>` : null}
  <input ref=${fileRef} type="file" hidden multiple accept=".csv,.pdf,.png,.jpg,.jpeg,.gif,.webp,.txt,.md,.json" onChange=${(e) => { uploadFiles(e.target.files, centerWorld()); e.target.value = ''; }} />
  <${Toast} />
  <div class="sr" role="status" aria-live="polite">${announcement}</div>
  <//>`;
}

ReactDOM.createRoot(document.getElementById('app')).render(html`<${App} />`);
})();
</script>
