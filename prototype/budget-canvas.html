<title>Collabfin Budget Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
:root {
  --surface: #f6f8fc; --surface-raised: #ffffff; --surface-sunken: #eceff7; --canvas: #eef1f8; --grid-dot: #c5cce0;
  --line: #d9deea; --line-strong: #7d88a6;
  --ink: #0b1430; --ink-muted: #4a5573; --ink-subtle: #636d8a;
  --brand: #1a4fe6; --brand-hover: #1440c4; --on-brand: #ffffff; --brand-ink: #1a4fe6; --brand-soft: #e6edff;
  --accent: #f5b83d; --on-accent: #0b1430; --accent-soft: #fdf3dc; --accent-line: #f0d9a6; --accent-ink: #8a5a00;
  --gain: #0a7a5a; --gain-soft: #e3f6ee; --loss: #c62f27; --loss-soft: #fde8e6;
  --scrim: #0b143059;
  --shadow-sm: 0 1px 2px #0b14300f, 0 1px 3px #0b143014;
  --shadow-md: 0 2px 4px #0b14300d, 0 10px 24px -6px #0b143026;
  --shadow-lg: 0 8px 16px #0b143014, 0 24px 48px -8px #0b143033;
  --shadow-cta: 0 6px 16px -4px #1a4fe673;
  --focus-ring: 0 0 0 2px #f6f8fc, 0 0 0 4px #1a4fe6;
  --font-display: "Bricolage Grotesque", "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
  --font-sans: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: #0a0f1f; --surface-raised: #121a31; --surface-sunken: #060a16; --canvas: #070b17; --grid-dot: #26314f;
    --line: #232d4a; --line-strong: #5d6a97;
    --ink: #eef2ff; --ink-muted: #a9b3d1; --ink-subtle: #8b95b6;
    --brand: #3563f5; --brand-hover: #2a55e0; --on-brand: #ffffff; --brand-ink: #8aa8ff; --brand-soft: #172a5c;
    --accent: #f5c46a; --on-accent: #0a0f1f; --accent-soft: #2e2410; --accent-line: #4a3a17; --accent-ink: #f5c46a;
    --gain: #3ddc97; --gain-soft: #0f2a22; --loss: #ff7a70; --loss-soft: #361615;
    --scrim: #000000a6;
    --shadow-sm: 0 1px 3px #000000b3;
    --shadow-md: 0 2px 4px #00000066, 0 12px 28px -6px #000000cc;
    --shadow-lg: 0 8px 16px #00000080, 0 24px 48px -8px #000000e6;
    --shadow-cta: 0 6px 20px -4px #3563f599;
    --focus-ring: 0 0 0 2px #0a0f1f, 0 0 0 4px #8aa8ff;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #0a0f1f; --surface-raised: #121a31; --surface-sunken: #060a16; --canvas: #070b17; --grid-dot: #26314f;
  --line: #232d4a; --line-strong: #5d6a97;
  --ink: #eef2ff; --ink-muted: #a9b3d1; --ink-subtle: #8b95b6;
  --brand: #3563f5; --brand-hover: #2a55e0; --on-brand: #ffffff; --brand-ink: #8aa8ff; --brand-soft: #172a5c;
  --accent: #f5c46a; --on-accent: #0a0f1f; --accent-soft: #2e2410; --accent-line: #4a3a17; --accent-ink: #f5c46a;
  --gain: #3ddc97; --gain-soft: #0f2a22; --loss: #ff7a70; --loss-soft: #361615;
  --scrim: #000000a6;
  --shadow-sm: 0 1px 3px #000000b3;
  --shadow-md: 0 2px 4px #00000066, 0 12px 28px -6px #000000cc;
  --shadow-lg: 0 8px 16px #00000080, 0 24px 48px -8px #000000e6;
  --shadow-cta: 0 6px 20px -4px #3563f599;
  --focus-ring: 0 0 0 2px #0a0f1f, 0 0 0 4px #8aa8ff;
}

html, body { height: 100%; }
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ico { display: block; flex: none; }
.eyebrow { font: 600 11px/14px var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.pos { color: var(--gain); } .neg { color: var(--loss); } .zero { color: var(--ink-muted); }

/* ---------- viewport ---------- */
#app { position: fixed; inset: 0; }
.vp { position: absolute; inset: 0; overflow: hidden; touch-action: none; outline: none;
  background-color: var(--canvas); background-image: radial-gradient(circle, var(--grid-dot) 1.25px, transparent 1.6px); }
.vp.hand { cursor: grab; } .vp.panning { cursor: grabbing; } .vp.wiring { cursor: crosshair; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.links { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.link-hit { fill: none; stroke: transparent; stroke-width: 18; pointer-events: stroke; cursor: pointer; }
.link-line { fill: none; stroke: var(--line-strong); stroke-width: 2.5; pointer-events: none; }
.link-arrow { fill: var(--line-strong); }
.link.on .link-line, .link:hover .link-line { stroke: var(--brand-ink); }
.link.on .link-arrow, .link:hover .link-arrow { fill: var(--brand-ink); }
.link.on .link-line { stroke-width: 3.5; }
.wire { fill: none; stroke: var(--brand-ink); stroke-width: 2.5; stroke-dasharray: 6 6; }
.link-tag { position: absolute; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 4px; padding: 3px 6px 3px 10px; border-radius: 999px; background: var(--surface-raised); border: 1px solid var(--line); box-shadow: var(--shadow-sm); font: 500 13px/18px var(--font-mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
.link-tag.no-x { padding-right: 10px; }
.link-tag.on { border-color: var(--brand-ink); }
.link-tag button { display: grid; place-items: center; width: 24px; height: 24px; border: 0; border-radius: 999px; background: var(--surface-sunken); color: var(--ink-muted); }

/* ---------- cards ---------- */
.card { position: absolute; background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow-md); user-select: none; -webkit-user-select: none; touch-action: none; }
.card.sel { outline: 2px solid var(--brand-ink); outline-offset: 2px; z-index: 3; }
.card.hot { outline: 2px dashed var(--brand-ink); outline-offset: 4px; }
.card.lifted { box-shadow: var(--shadow-lg); z-index: 4; }
.card.has-error { border-color: var(--loss); }
.card:has(.tip) { z-index: 7; }
.card input, .card textarea, .card select { user-select: text; -webkit-user-select: text; }
.card-head { display: flex; align-items: center; gap: 8px; height: 60px; padding: 0 10px 0 14px; border-bottom: 1px solid var(--line); cursor: grab; }
.kind { display: grid; place-items: center; flex: none; width: 34px; height: 34px; border-radius: var(--r-sm); }
.k-income .kind, .pal-income { background: var(--gain-soft); color: var(--gain); }
.k-spend .kind, .pal-spend, .k-recurring .kind, .pal-recurring { background: var(--loss-soft); color: var(--loss); }
.k-account .kind, .pal-account { background: var(--brand-soft); color: var(--brand-ink); }
.k-split .kind, .pal-split { background: var(--surface-sunken); color: var(--ink-muted); }
.k-goal .kind, .pal-goal { background: var(--accent-soft); color: var(--accent-ink); }
.pal-note { background: var(--accent); color: var(--on-accent); }
.k-file .kind { background: var(--surface-sunken); color: var(--ink-muted); }
.head-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.title-input { width: 100%; margin: 0 0 0 -5px; padding: 1px 5px; border: 0; border-radius: 6px; background: transparent; font: 650 17px/22px var(--font-display); letter-spacing: -.01em; font-variation-settings: 'opsz' 24; color: var(--ink); text-overflow: ellipsis; }
.title-input:hover { background: var(--surface-sunken); }
.title-input:focus { background: var(--surface-sunken); box-shadow: 0 0 0 2px var(--brand-ink); outline: none; }
.card-body { display: flex; flex-direction: column; gap: 12px; padding: 14px; }
.card-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 12px 14px 14px; border-top: 1px solid var(--line); background: var(--surface); border-radius: 0 0 var(--r-md) var(--r-md); }
.foot-sub { margin-top: 2px; font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
.flow { font: 700 26px/1 var(--font-display); letter-spacing: -.02em; font-variation-settings: 'opsz' 48; font-variant-numeric: tabular-nums; white-space: nowrap; }
.warn { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: var(--r-sm); background: var(--loss-soft); color: var(--loss); font: 500 13px/18px var(--font-sans); }
.chk { display: inline-flex; align-items: center; gap: 4px; flex: none; height: 28px; padding: 0 8px; border: 0; border-radius: 999px; font: 600 12px/16px var(--font-mono); }
.lv-error.chk, .lv-error .lv-ico { background: var(--loss-soft); color: var(--loss); }
.lv-warn.chk, .lv-warn .lv-ico { background: var(--accent-soft); color: var(--accent-ink); }
.lv-tip.chk, .lv-tip .lv-ico { background: var(--brand-soft); color: var(--brand-ink); }

.port { position: absolute; top: 30px; width: 16px; height: 16px; margin-top: -8px; border-radius: 999px; background: var(--surface-raised); border: 2px solid var(--line-strong); z-index: 2; }
.port::before { content: ""; position: absolute; inset: -14px; border-radius: 999px; }
.port.in { left: -9px; pointer-events: none; }
.port.out { right: -9px; border-color: var(--brand-ink); cursor: crosshair; }
.port.out:hover, .card.sel .port.out { background: var(--brand); border-color: var(--brand); }
.wiring .port.in { border-color: var(--brand-ink); }

.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { display: flex; align-items: center; gap: 4px; min-height: 20px; font: 600 11px/14px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
.mi { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.box { display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 12px; background: var(--surface-raised); border: 1px solid var(--line-strong); border-radius: var(--r-sm); transition: box-shadow .15s ease; }
.box:focus-within { border-color: var(--brand-ink); box-shadow: 0 0 0 3px var(--brand-soft); }
.box.bad { border-color: var(--loss); box-shadow: 0 0 0 3px var(--loss-soft); }
.box .pre, .box .suf { font: 500 15px/20px var(--font-mono); color: var(--ink-muted); }
.box input { flex: 1; min-width: 0; width: 100%; height: 100%; padding: 0; border: 0; outline: none; background: transparent; font: 500 16px/20px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink); }
.box input::placeholder { color: var(--ink-subtle); }
.box.sm { height: 36px; padding: 0 8px; }
.box.sm input { font-size: 14px; }
.field-err { font: 500 12px/16px var(--font-sans); color: var(--loss); text-transform: none; letter-spacing: 0; }
.select { height: 44px; width: 100%; padding: 0 8px; background: var(--surface-raised); border: 1px solid var(--line-strong); border-radius: var(--r-sm); color: var(--ink); font: 500 14px/20px var(--font-sans); }
.select.sm { height: 36px; font-size: 13px; padding: 0 4px; }
.select:focus { outline: none; box-shadow: var(--focus-ring); }

.items { display: flex; flex-direction: column; gap: 6px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) 100px 104px 28px; gap: 6px; align-items: center; }
.item .name { height: 36px; min-width: 0; padding: 0 8px; border: 1px solid transparent; border-radius: 8px; background: var(--surface-sunken); font: 500 14px/20px var(--font-sans); color: var(--ink); }
.item .name:focus { outline: none; border-color: var(--brand-ink); background: var(--surface-raised); }
.item .name.bad { border-color: var(--accent-ink); }
.icon-btn { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--ink-subtle); }
.icon-btn:hover { background: var(--loss-soft); color: var(--loss); }
.add-row { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; height: 36px; padding: 0 10px 0 6px; border: 0; border-radius: 8px; background: transparent; color: var(--brand-ink); font: 600 14px/20px var(--font-sans); }
.add-row:hover { background: var(--brand-soft); }

.hero { font: 700 46px/.95 var(--font-display); letter-spacing: -.035em; font-variation-settings: 'opsz' 96; font-variant-numeric: tabular-nums; color: var(--ink); overflow-wrap: anywhere; }
.hero.neg { color: var(--loss); }
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface-sunken); }
.seg button { flex: 1; height: 34px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-muted); font: 600 13px/16px var(--font-sans); }
.seg button.on { background: var(--surface-raised); color: var(--ink); box-shadow: var(--shadow-sm); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.row .eyebrow { display: inline-flex; align-items: center; gap: 4px; }
.delta { display: inline-flex; align-items: center; gap: 3px; padding: 2px 10px 2px 7px; border-radius: 999px; font: 500 14px/20px var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.delta.pos { background: var(--gain-soft); } .delta.neg { background: var(--loss-soft); } .delta.zero { background: var(--surface-sunken); padding-left: 10px; }
.bar { height: 8px; border-radius: 999px; background: var(--surface-sunken); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.hint { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }
.hint.neg { color: var(--loss); font-weight: 600; }
.range { width: 100%; accent-color: var(--brand); }
.done-pill { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; padding: 4px 10px; border-radius: 999px; background: var(--gain-soft); color: var(--gain); font: 600 13px/18px var(--font-sans); }

.card.k-note { background: var(--accent-soft); border-color: var(--accent-line); }
.note-grip { height: 22px; cursor: grab; border-radius: var(--r-md) var(--r-md) 0 0; }
.note-text { display: block; width: 100%; min-height: 150px; box-sizing: border-box; padding: 0 16px 16px; border: 0; outline: none; resize: none; background: transparent; font: 500 17px/24px var(--font-sans); color: var(--ink); }
.note-text::placeholder { color: var(--ink-muted); }
.file-thumb { display: block; width: 100%; max-height: 180px; object-fit: cover; border-radius: var(--r-sm); background: var(--surface-sunken); }
.file-name { font: 600 15px/20px var(--font-sans); overflow-wrap: anywhere; }
.file-meta { font: 500 12px/16px var(--font-mono); color: var(--ink-muted); }
.file-open { align-self: flex-start; color: var(--brand-ink); font: 600 14px/20px var(--font-sans); text-decoration: none; }
.file-open:hover { text-decoration: underline; }
.pending .bar > span { width: 40%; background: var(--brand); animation: indet 1.1s ease-in-out infinite; }
@keyframes indet { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }

.ctx-anchor { position: absolute; width: 0; height: 0; z-index: 5; }
.ctx { position: absolute; left: 0; bottom: 0; display: flex; gap: 2px; padding: 4px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); transform-origin: 0 100%; }
.ctx button { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); font: 600 14px/20px var(--font-sans); white-space: nowrap; }
.ctx button:hover { background: var(--surface-sunken); }
.ctx button.danger:hover { background: var(--loss-soft); color: var(--loss); }

/* ---------- info tips ---------- */
.info-wrap { position: relative; display: inline-flex; flex: none; text-transform: none; letter-spacing: 0; }
.info { display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 999px; background: transparent; color: var(--ink-subtle); }
.info:hover, .info[aria-expanded="true"] { background: var(--brand-soft); color: var(--brand-ink); }
.info::before { content: ""; position: absolute; inset: -8px; }
.tip { position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); z-index: 60; width: 264px; padding: 12px 14px; border-radius: 12px; background: var(--ink); color: var(--surface); box-shadow: var(--shadow-lg); font: 400 13px/19px var(--font-sans); text-align: left; white-space: normal; cursor: default; user-select: text; }
.tip.right { left: auto; right: -8px; transform: none; }
.tip.left { left: -8px; transform: none; }
.tip b { display: block; margin-bottom: 2px; font-weight: 700; }
.tip p { margin: 0; }
.tip p + b { margin-top: 10px; }

/* ---------- chrome ---------- */
.top { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; z-index: 20; display: flex; align-items: flex-start; gap: 12px; pointer-events: none; }
.top > * { pointer-events: auto; }
.top .spacer { flex: 1; pointer-events: none; }
.pill { display: flex; align-items: center; gap: 4px; padding: 4px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-sm); }
.board { gap: 10px; min-width: 0; padding: 6px 12px 6px 14px; }
.wordmark { font: 800 18px/1 var(--font-display); letter-spacing: -.03em; color: var(--brand-ink); white-space: nowrap; }
.divider { width: 1px; height: 24px; background: var(--line); flex: none; }
.board-title { min-width: 0; width: 20ch; max-width: 34vw; height: 32px; padding: 0 6px; border: 0; border-radius: 8px; background: transparent; font: 600 16px/20px var(--font-sans); color: var(--ink); }
.board-title:hover, .board-title:focus { background: var(--surface-sunken); outline: none; }
.status { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/16px var(--font-sans); color: var(--ink-muted); white-space: nowrap; }
.status i { width: 8px; height: 8px; border-radius: 999px; background: var(--gain); }
.status.local i { background: var(--line-strong); }
.top-btn { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: var(--ink); font: 600 14px/20px var(--font-sans); white-space: nowrap; }
.top-btn:hover { background: var(--surface-sunken); }
.top-btn.on { background: var(--brand-soft); color: var(--brand-ink); }
.count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; font: 700 11px/1 var(--font-mono); }
.count.lv-error { background: var(--loss); color: var(--surface); }
.count.lv-warn { background: var(--accent); color: var(--on-accent); }
.count.lv-tip { background: var(--brand-soft); color: var(--brand-ink); }
.count.ok { background: var(--gain-soft); color: var(--gain); }
.summary { display: flex; align-items: flex-end; gap: 20px; padding: 10px 14px 12px 18px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-sm); }
.sum-item { display: flex; flex-direction: column; gap: 4px; }
.sum-item .eyebrow { display: inline-flex; align-items: center; gap: 2px; }
.sum-fig { font: 700 20px/1 var(--font-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sum-item.net .sum-fig { font-size: 34px; letter-spacing: -.03em; font-variation-settings: 'opsz' 72; }

.rail { position: fixed; left: 12px; top: 50%; transform: translateY(-50%); z-index: 20; display: flex; flex-direction: column; gap: 2px; padding: 6px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow-lg); }
.rail-sep { height: 1px; margin: 4px 6px; background: var(--line); }
.tool { position: relative; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; background: transparent; color: var(--ink-muted); touch-action: none; }
.tool:hover { background: var(--surface-sunken); color: var(--ink); }
.tool.on { background: var(--brand-soft); color: var(--brand-ink); }
.tool .pal { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; }
.tool.upload { background: var(--brand); color: var(--on-brand); box-shadow: var(--shadow-cta); }
.tool.upload:hover { background: var(--brand-hover); }
.rail .tool[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: 54px; top: 50%; transform: translateY(-50%); padding: 6px 10px; border-radius: 8px; background: var(--ink); color: var(--surface); font: 600 13px/16px var(--font-sans); white-space: nowrap; pointer-events: none; }
.zoombar { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; align-items: center; gap: 2px; padding: 4px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg); }
.zoombar .tool { width: 40px; height: 40px; border-radius: 10px; }
.zoom-pct { min-width: 56px; height: 40px; border: 0; border-radius: 10px; background: transparent; font: 500 14px/20px var(--font-mono); color: var(--ink); }
.zoom-pct:hover { background: var(--surface-sunken); }

.dock { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: none; align-items: center; gap: 6px; padding: 6px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow-lg); }
.cta { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 56px; padding: 0 24px; border: 0; border-radius: 18px; background: var(--brand); color: var(--on-brand); font: 600 17px/20px var(--font-sans); box-shadow: var(--shadow-cta); white-space: nowrap; }
.cta:hover { background: var(--brand-hover); }
.dock .cta { flex: 1; }
.btn2 { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px; border: 1px solid var(--line-strong); border-radius: var(--r-md); background: var(--surface-raised); color: var(--ink); font: 600 16px/20px var(--font-sans); }
.btn2:hover { background: var(--surface-sunken); }
.btn-sm { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface-raised); color: var(--ink); font: 600 14px/20px var(--font-sans); white-space: nowrap; }
.btn-sm:hover { background: var(--surface-sunken); }
.btn-sm.primary { border-color: var(--brand); background: var(--brand); color: var(--on-brand); }
.btn-sm.primary:hover { background: var(--brand-hover); }
.btn-sm.danger { border-color: var(--loss); background: var(--loss); color: var(--surface); }

/* ---------- panels ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); }
.scrim.phone-only { display: none; }
.panel { position: fixed; right: 12px; top: calc(96px + env(safe-area-inset-top, 0px)); bottom: 12px; z-index: 41; display: flex; flex-direction: column; width: 400px; max-width: calc(100% - 24px); background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); }
.panel-head { display: flex; align-items: flex-start; gap: 12px; padding: 20px 16px 12px 20px; }
.panel-head h2 { flex: 1; margin: 0; font: 700 30px/1 var(--font-display); letter-spacing: -.025em; font-variation-settings: 'opsz' 48; }
.panel-head p { margin: 6px 0 0; font: 400 14px/20px var(--font-sans); color: var(--ink-muted); }
.panel-body { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 20px; padding: 4px 20px 24px; }
.close { display: grid; place-items: center; width: 44px; height: 44px; margin: -8px -4px 0 0; border: 0; border-radius: 12px; background: transparent; color: var(--ink-muted); }
.close:hover { background: var(--surface-sunken); color: var(--ink); }
.grab { display: none; width: 40px; height: 5px; margin: 8px auto 0; border-radius: 999px; background: var(--line); }
.group { display: flex; flex-direction: column; gap: 8px; }
.group > .eyebrow { display: flex; align-items: center; gap: 6px; }

.check { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
.lv-ico { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; }
.check p { margin: 3px 0 0; font: 500 14px/20px var(--font-sans); }
.check-actions { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; }
.all-good { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 20px; border-radius: var(--r-md); background: var(--gain-soft); color: var(--gain); }
.all-good b { font: 700 22px/1.1 var(--font-display); }
.all-good span { color: var(--ink); font-size: 14px; line-height: 20px; }

.tpl { display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
.tpl h3 { margin: 0; font: 700 20px/24px var(--font-display); letter-spacing: -.015em; }
.tpl p { margin: 0; font: 400 14px/20px var(--font-sans); color: var(--ink-muted); }
.tpl-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips .pal { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; }
.tpl-net { text-align: right; }
.tpl-net b { display: block; font: 700 20px/1 var(--font-display); font-variant-numeric: tabular-nums; }

.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.set-label { display: flex; align-items: center; gap: 4px; min-width: 0; font: 500 15px/20px var(--font-sans); }
.set-label small { display: block; color: var(--ink-muted); font-size: 13px; line-height: 18px; }
.set-control { flex: none; width: 150px; }
.set-control.wide { width: 180px; }
.switch { position: relative; flex: none; width: 48px; height: 28px; padding: 0; border: 0; border-radius: 999px; background: var(--line-strong); transition: background-color .15s ease; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 999px; background: var(--surface-raised); box-shadow: var(--shadow-sm); transition: transform .15s ease; }
.switch[aria-checked="true"] { background: var(--brand); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.auto { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 0; }
.auto + .auto { border-top: 1px solid var(--line); }
.auto-text { font: 400 14px/20px var(--font-sans); color: var(--ink-muted); }
.auto-text b { color: var(--ink); font-weight: 600; }
.confirm { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: var(--r-md); background: var(--loss-soft); }
.confirm p { margin: 0; color: var(--ink); font-size: 14px; line-height: 20px; }

.sheet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pal-item { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-height: 104px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); text-align: left; }
.pal-item .pal { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; }
.pal-item b { font: 600 16px/20px var(--font-sans); }
.pal-item span { font: 400 13px/17px var(--font-sans); color: var(--ink-muted); }

.empty { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 10; width: min(560px, calc(100% - 32px)); box-sizing: border-box; padding: 32px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--shadow-lg); }
.empty h1 { margin: 12px 0; font: 750 56px/.92 var(--font-display); letter-spacing: -.04em; font-variation-settings: 'opsz' 96; text-wrap: balance; }
.empty p { margin: 0 0 24px; max-width: 42ch; font: 400 18px/28px var(--font-sans); color: var(--ink-muted); }
.empty .actions { display: flex; flex-wrap: wrap; gap: 8px; }

.banner { position: fixed; left: 50%; top: calc(84px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 25; display: flex; align-items: center; gap: 12px; max-width: calc(100% - 24px); padding: 8px 8px 8px 16px; border-radius: 16px; background: var(--ink); color: var(--surface); font: 500 15px/20px var(--font-sans); box-shadow: var(--shadow-lg); }
.banner button { height: 36px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--surface-raised); color: var(--ink); font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; display: flex; align-items: center; gap: 10px; max-width: min(520px, calc(100% - 32px)); padding: 12px 16px; border-radius: 14px; background: var(--ink); color: var(--surface); font: 500 15px/20px var(--font-sans); box-shadow: var(--shadow-lg); }
.toast .tag { flex: none; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: 700 11px/16px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; }
.dropzone { position: fixed; inset: 12px; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; border: 2px dashed var(--brand-ink); border-radius: var(--r-lg); background: var(--brand-soft); opacity: .95; color: var(--brand-ink); font: 700 28px/32px var(--font-display); pointer-events: none; }
.ghost { position: fixed; z-index: 60; display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 8px; background: var(--surface-raised); border: 1px solid var(--brand-ink); border-radius: 12px; box-shadow: var(--shadow-lg); font: 600 14px/20px var(--font-sans); pointer-events: none; transform: translate(-50%, -50%); }
.ghost .pal { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; }

@media (min-width: 720px) { .top { left: 72px; } }
@media (min-width: 720px) and (max-width: 1240px) { .top-btn .lbl { display: none; } .top-btn { padding: 0 10px; } .summary .sum-item:not(.net) { display: none; } }
@media (max-width: 719px) {
  .rail, .zoombar { display: none; }
  .dock { display: flex; }
  .top { flex-wrap: wrap; }
  .top .spacer { display: none; }
  .actions-pill { margin-left: auto; }
  .top-btn .lbl { display: none; }
  .top-btn { padding: 0 10px; }
  .summary { order: 3; padding: 8px 12px 10px; }
  .summary .sum-item:not(.net) { display: none; }
  .sum-item.net .sum-fig { font-size: 24px; }
  .board-title { width: 11ch; }
  .status span, .board .divider, .board .wordmark { display: none; }
  .empty { top: auto; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 24px; }
  .empty h1 { font-size: 44px; }
  .empty p { font-size: 16px; line-height: 24px; }
  .scrim.phone-only { display: block; }
  .panel { left: 0; right: 0; bottom: 0; top: auto; width: auto; max-width: none; max-height: 86vh; border-radius: 24px 24px 0 0; border-bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .grab { display: block; }
  .set-control { width: 128px; }
}
@media (prefers-reduced-motion: reduce) { .pending .bar > span { animation: none; width: 100%; opacity: .5; } .box, .switch, .switch::after { transition: none; } }

/* ---------- v3: scenarios, presence, history, import, debt ---------- */
.k-debt .kind, .pal-debt { background: var(--loss-soft); color: var(--loss); }
.save-line { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: var(--r-sm); background: var(--gain-soft); color: var(--gain); font: 500 13px/18px var(--font-sans); }
.board-wrap { position: relative; display: flex; min-width: 0; }
.scen-btn { display: inline-flex; align-items: center; gap: 4px; flex: none; max-width: 180px; height: 32px; padding: 0 6px 0 10px; border: 0; border-radius: 8px; background: var(--brand-soft); color: var(--brand-ink); font: 600 13px/16px var(--font-sans); white-space: nowrap; }
.scen-btn span { overflow: hidden; text-overflow: ellipsis; }
.menu { position: absolute; top: calc(100% + 8px); left: 0; z-index: 45; width: 320px; max-width: calc(100vw - 24px); padding: 6px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg); }
.menu-title { padding: 8px 10px 4px; }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); font: 500 15px/20px var(--font-sans); text-align: left; }
.menu-item:hover { background: var(--surface-sunken); }
.menu-item .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-item .ck { width: 18px; color: var(--brand-ink); }
.menu-item.danger { color: var(--loss); }
.menu-sep { height: 1px; margin: 6px 4px; background: var(--line); }
.menu-form { display: flex; flex-direction: column; gap: 8px; padding: 8px 10px 10px; }
.menu-form .row-btns { display: flex; gap: 6px; }
.text-in { height: 44px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface-raised); color: var(--ink); font: 500 15px/20px var(--font-sans); }
.text-in:focus { outline: none; border-color: var(--brand-ink); box-shadow: 0 0 0 3px var(--brand-soft); }
.text-in.bad { border-color: var(--loss); }

.peers { display: flex; align-items: center; padding-left: 6px; }
.av { position: relative; display: inline-grid; place-items: center; flex: none; width: 32px; height: 32px; margin-left: -6px; border-radius: 999px; font: 700 12px/1 var(--font-sans); box-shadow: 0 0 0 2px var(--surface-raised); }
.av.more { background: var(--surface-sunken); color: var(--ink-muted); }
.p1 { background: var(--presence-1); color: var(--on-presence); } .p2 { background: var(--presence-2); color: var(--on-presence); }
.p3 { background: var(--presence-3); color: var(--on-presence); } .p4 { background: var(--presence-4); color: var(--on-presence); }
.f1 { fill: var(--presence-1); --pc: var(--presence-1); } .f2 { fill: var(--presence-2); --pc: var(--presence-2); }
.f3 { fill: var(--presence-3); --pc: var(--presence-3); } .f4 { fill: var(--presence-4); --pc: var(--presence-4); }
.cursor { position: absolute; z-index: 8; transform-origin: 0 0; pointer-events: none; transition: left .08s linear, top .08s linear; }
.cursor svg { display: block; stroke: var(--surface-raised); stroke-width: 1.5; }
.cursor-tag { position: absolute; left: 14px; top: 16px; padding: 2px 8px; border-radius: 999px; font: 600 12px/16px var(--font-sans); white-space: nowrap; }
.card.peer-edit { outline: 2px dashed var(--pc); outline-offset: 4px; }
.edit-tag { position: absolute; left: 0; top: -30px; padding: 3px 10px; border-radius: 999px; font: 600 12px/16px var(--font-sans); white-space: nowrap; }

.top-btn:disabled { opacity: .4; cursor: default; background: transparent; }
.hist-row { display: grid; grid-template-columns: 32px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.hist-row .av { margin-left: 0; }
.hist-text { font: 500 14px/20px var(--font-sans); overflow-wrap: anywhere; }
.hist-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 2px; font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
.scen-tag { padding: 1px 8px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-ink); font-weight: 600; }
.undo-box { display: flex; flex-wrap: wrap; gap: 6px; }
.muted { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); margin: 0; }

.panel.wide { width: min(780px, calc(100% - 24px)); }
.cmp-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); }
.cmp { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.cmp th, .cmp td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: top; white-space: nowrap; font: 500 14px/20px var(--font-mono); }
.cmp th:first-child, .cmp td:first-child { position: sticky; left: 0; z-index: 1; min-width: 150px; background: var(--surface-raised); text-align: left; white-space: normal; font: 500 14px/20px var(--font-sans); }
.cmp thead th { font: 700 15px/20px var(--font-display); vertical-align: bottom; }
.cmp thead th .btn-sm { margin-top: 6px; }
.cmp tr.sec td { padding-top: 16px; font: 600 11px/14px var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.cmp .cur { background: var(--brand-soft); }
.cmp td .d { display: block; margin-top: 2px; font-size: 12px; }
.cmp tr:last-child td { border-bottom: 0; }

.drop-mini { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 24px 16px; text-align: center; border: 1.5px dashed var(--line-strong); border-radius: var(--r-md); background: var(--surface); }
.drop-mini.over { border-color: var(--brand-ink); background: var(--brand-soft); }
.drop-mini b { font: 700 20px/24px var(--font-display); }
.privacy { display: flex; gap: 8px; align-items: flex-start; font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }
.map-grid { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; }
.map-grid label { font: 600 14px/20px var(--font-sans); }
.preview-tbl { width: 100%; border-collapse: collapse; font: 400 12px/16px var(--font-mono); }
.preview-tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
.rv { display: flex; flex-direction: column; gap: 2px; padding: 4px 0; }
.rv-row { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: center; min-height: 44px; padding: 0 4px; border-radius: 10px; }
.rv-row:hover { background: var(--surface-sunken); }
.rv-row input { width: 18px; height: 18px; accent-color: var(--brand); }
.rv-row span.n { font: 500 14px/18px var(--font-sans); }
.rv-row span.n small { display: block; color: var(--ink-muted); font-size: 12px; }
.rv-row b { font: 500 14px/18px var(--font-mono); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line); }
.stat b { display: block; font: 700 22px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.import-cta { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r-md); background: var(--brand-soft); color: var(--brand-ink); }
.import-cta div { flex: 1; font: 500 14px/20px var(--font-sans); color: var(--ink); }
.import-cta b { display: block; font: 700 17px/22px var(--font-display); color: var(--brand-ink); }
@media (max-width: 719px) {
  .undo-top { display: none; }
  .scen-btn { max-width: 120px; }
  .stats { grid-template-columns: 1fr 1fr; }
}

/* ---------- v4: account types + taxes ---------- */
.k-tax .kind, .pal-tax { background: var(--surface-sunken); color: var(--ink); }
.seg button { padding: 0 2px; }
input[type="month"].select { padding: 0 8px; font-family: var(--font-mono); }
.range-row { display: flex; gap: 8px; }
.range-row > div { flex: 1; min-width: 0; padding: 6px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.range-row span { display: block; font: 600 10px/14px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
.range-row b { font: 600 15px/20px var(--font-mono); font-variant-numeric: tabular-nums; }
.disclaimer { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: var(--r-sm); background: var(--surface-sunken); color: var(--ink-muted); font: 400 12px/17px var(--font-sans); user-select: text; -webkit-user-select: text; }
.disclaimer .ico { margin-top: 1px; }
.bd { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line); }
.bd .eyebrow { margin-bottom: 2px; }
.bd-row { display: flex; justify-content: space-between; gap: 8px; font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }
.bd-row b { font: 500 13px/18px var(--font-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.bd-row.total { margin-top: 4px; padding-top: 6px; border-top: 1px solid var(--line); color: var(--ink); font-weight: 600; }
.bd-row.total b { font-weight: 700; }
.muted a { color: var(--brand-ink); }

/* ---------- Select (Collabfin dropdown, shadcn-style) ---------- */
.sel-trigger { display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%; min-width: 0; height: 44px; padding: 0 10px 0 12px; background: var(--surface-raised); border: 1px solid var(--line-strong); border-radius: var(--r-sm); color: var(--ink); font: 500 14px/20px var(--font-sans); text-align: left; cursor: pointer; transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease; }
.sel-trigger:hover { background: var(--surface); }
.sel-trigger:focus-visible, .sel-trigger.open { outline: none; border-color: var(--brand-ink); box-shadow: 0 0 0 3px var(--brand-soft); }
.sel-trigger .ico { flex: none; color: var(--ink-muted); transition: transform .15s ease; }
.sel-trigger.open .ico { transform: rotate(180deg); }
.sel-trigger.sm { height: 36px; padding: 0 6px 0 8px; font-size: 13px; }
.sel-value { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sel-value.ph { color: var(--ink-subtle); }
.sel-pop { position: fixed; z-index: 90; display: flex; flex-direction: column; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); overflow: hidden; animation: sel-in .12s ease-out; }
@keyframes sel-in { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
.sel-search { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-bottom: 1px solid var(--line); color: var(--ink-muted); }
.sel-search input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: none; background: transparent; color: var(--ink); font: 500 14px/20px var(--font-sans); }
.sel-search input::placeholder { color: var(--ink-subtle); }
.sel-list { overflow-y: auto; padding: 4px; outline: none; overscroll-behavior: contain; }
.sel-opt { display: flex; align-items: center; gap: 2px; min-height: 36px; padding: 6px 10px 6px 4px; border-radius: 8px; color: var(--ink); font: 500 14px/20px var(--font-sans); cursor: pointer; user-select: none; -webkit-user-select: none; }

        if ((nt === 'savings' || nt === 'cd') && c.apy == null) p.apy = 4;
        if (nt === 'cd') { if (!c.term) p.term = 12; if (!c.opened) { const d = new Date(); p.opened = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); } }
        if (nt === 'investment') { if (c.ret == null) p.ret = 6; if (c.fees == null) p.fees = 0.2; if (num(c.horizon) < 60) p.horizon = 120; }
        if (nt !== 'investment' && num(c.horizon) > 24) p.horizon = 12;
        up(p);
      };
      const typeSeg = html`<div class="seg" role="group" aria-label="Account type">${Object.entries(ACCOUNT_TYPES).map(([k, l]) => html`<button key=${k} class=${k === t ? 'on' : ''} aria-pressed=${k === t} onClick=${() => k !== t && setType(k)}>${l}</button>`)}</div>`;
      const pctOf = (v) => (Math.round(v * 10) / 10) + '%';
      if (t === 'cd') {
        const cd = pr.cd;
        return html`<div class="card-body">${typeSeg}
          <div><div class="eyebrow">${cd.matured ? 'Matured at' : 'Worth at maturity'}</div><div class="hero">${money(cd.maturity)}</div></div>
          <div class="hint">${c.opened ? (cd.matured ? 'Matured in ' + monthLabel(cd.left) + '.' : 'Matures ' + monthLabel(cd.left) + ', in ' + plural(cd.left, 'month') + '. Worth about ' + money(cd.now) + ' today.') : 'Set the month it opened to see when it matures.'}${num(c.taxPct) > 0 ? ' After ' + num(c.taxPct) + '% tax on interest.' : ''}</div>
          <div class="fields">
            <${Field} label="Deposit"><${NumberInput} rule="amount" label="Deposit" value=${c.balance} onCommit=${(v) => up({ balance: v })} /></${Field}>
            <${Field} label="APY" tip=${FIELD_TIPS.apy}><${NumberInput} rule="apy" suffix="%" label="APY" value=${c.apy} onCommit=${(v) => up({ apy: v })} /></${Field}>
            <${Field} label="Term" tip=${FIELD_TIPS.term}><${Select} label="Term" value=${c.term || 12} searchable=${false} options=${[3, 6, 9, 12, 18, 24, 36, 48, 60].map((m) => ({ value: m, label: m + ' months' }))} onChange=${(v) => up({ term: Number(v) })} /></${Field}>
            <${Field} label="Opened" tip=${FIELD_TIPS.opened}><${MonthPicker} label="Opened" value=${c.opened} onChange=${(v) => up({ opened: v })} /></${Field}>
          </div>
          <${Field} label="Tax on interest" tip=${FIELD_TIPS.taxPct}><${NumberInput} rule="taxPct" suffix="%" label="Tax on interest" value=${c.taxPct} onCommit=${(v) => up({ taxPct: v })} /></${Field}>
          <div class="disclaimer" role="note"><${Icon} n="info" s=${16} /><span>Taking money out before a CD matures usually costs a penalty, often several months of interest.</span></div>
        </div>`;
      }
      const hs = t === 'investment' ? [[12, '1 yr'], [60, '5 yr'], [120, '10 yr'], [240, '20 yr']] : [[3, '3 mo'], [6, '6 mo'], [12, '12 mo'], [24, '24 mo']];
      const hLabel = pr.h > 24 ? (pr.h / 12) + ' years' : pr.h + ' months';
      return html`<div class="card-body">${typeSeg}
        <div><div class="eyebrow">${t === 'investment' ? 'Expected in ' + hLabel : 'Balance in ' + hLabel}</div><div class=${cls('hero', pr.end < 0 && 'neg')}>${money(pr.end)}</div></div>
        ${t === 'investment' ? html`<div class="range-row"><div><span>If ${pctOf(pr.rate * 100 - 3)} a year</span><b>${money(pr.low)}</b></div><div><span>If ${pctOf(pr.rate * 100 + 3)} a year</span><b>${money(pr.high)}</b></div></div>` : null}
        <div class="seg" role="group" aria-label="Projection length">${hs.map(([m, l]) => html`<button key=${m} class=${m === pr.h ? 'on' : ''} aria-pressed=${m === pr.h} onClick=${() => up({ horizon: m })}>${l}</button>`)}</div>
        <${Field} label="Balance today" tip=${FIELD_TIPS.balance}><${NumberInput} label="Balance today" rule="balance" value=${c.balance} onCommit=${(v) => up({ balance: v })} /></${Field}>
        ${t === 'savings' ? html`<div class="fields">
            <${Field} label="APY" tip=${FIELD_TIPS.apy}><${NumberInput} rule="apy" suffix="%" label="APY" value=${c.apy} onCommit=${(v) => up({ apy: v })} /></${Field}>
            <${Field} label="Tax on interest" tip=${FIELD_TIPS.taxPct}><${NumberInput} rule="taxPct" suffix="%" label="Tax on interest" value=${c.taxPct} onCommit=${(v) => up({ taxPct: v })} /></${Field}>
          </div>` : null}
        ${t === 'investment' ? html`<div class="fields">
            <${Field} label="Yearly return" tip=${FIELD_TIPS.ret}><${NumberInput} rule="ret" suffix="%" label="Yearly return" value=${c.ret} onCommit=${(v) => up({ ret: v })} /></${Field}>
            <${Field} label="Fees" tip=${FIELD_TIPS.fees}><${NumberInput} rule="fees" suffix="%" label="Fees per year" value=${c.fees} onCommit=${(v) => up({ fees: v })} /></${Field}>
          </div>
          <${Field} label="Tax on gains" tip=${FIELD_TIPS.taxPct}><${NumberInput} rule="taxPct" suffix="%" label="Tax on gains" value=${c.taxPct} onCommit=${(v) => up({ taxPct: v })} /></${Field}>` : null}
        <div class="row"><span class="eyebrow">Net flowing in</span><${Delta} v=${pr.inflow} /></div>
        ${pr.toSplits ? html`<div class="row"><span class="eyebrow">Sent to splits</span><${Delta} v=${-pr.toSplits} /></div>` : null}
        ${t !== 'checking' ? html`<div class="row"><span class="eyebrow">${t === 'investment' ? 'Growth' : 'Interest'} over ${hLabel}</span><${Delta} v=${pr.earned} /></div>` : null}
        ${settings.inflation > 0 && pr.inflow < 0 ? html`<div class="hint">Money going out rises ${settings.inflation}% a year in this projection.</div>` : null}
        ${pr.end < 0 ? html`<div class="warn"><${Icon} n="alert" s=${18} />This account runs out of money within ${hLabel}.</div>`
          : pr.firstBelow != null ? html`<div class="warn"><${Icon} n="alert" s=${18} />Drops below your ${money(settings.buffer)} buffer in month ${pr.firstBelow}.</div>` : null}
        ${t === 'investment' ? html`<div class="disclaimer" role="note"><${Icon} n="info" s=${16} /><span>Projection, not a promise. It assumes a steady average return after fees and before inflation. Real returns change from year to year and can be negative. This isn’t investment advice.</span></div>` : null}
      </div><${Foot} c=${c} flows=${flows} label="Available to split" />`;
    }
    case 'tax': {
      const mode = c.mode || 'paycheck', st = STATES[c.state];
      const TITLES = { paycheck: 'Paycheck', property: 'Property tax', sales: 'Sales tax' };
      const setMode = (m) => { const p = { mode: m }; if (!c.title || Object.values(TITLES).includes(c.title)) p.title = TITLES[m]; up(p); };
      const modeSeg = html`<div class="seg" role="group" aria-label="Tax type">${[['paycheck', 'Paycheck'], ['property', 'Property'], ['sales', 'Sales']].map(([m, l]) => html`<button key=${m} class=${m === mode ? 'on' : ''} aria-pressed=${m === mode} onClick=${() => m !== mode && setMode(m)}>${l}</button>`)}</div>`;
      const stateField = html`<${Field} label="State"><${Select} label="State" placeholder="Choose a state" value=${c.state || ''} options=${stateOptions('No state selected')} onChange=${(v) => up({ state: v })} /></${Field}>`;
      const note = html`<div class="disclaimer" role="note"><${Icon} n="info" s=${16} /><span>Estimate from ${TAX_YEAR} rates (IRS, Tax Foundation). It leaves out local taxes, credits and itemized deductions. Not tax advice.</span></div>`;
      const row = (label, v, extra) => html`<div class=${cls('bd-row', extra)}><span>${label}</span><b>${money(v)}</b></div>`;
      if (mode === 'paycheck') {
        const r = paycheckTax(c.gross, c.pretax, c.state, c.filing);
        return html`<div class="card-body">${modeSeg}
          <div><div class="eyebrow">Take-home per month</div><div class="hero">${money(r.takeHome / 12)}</div></div>
          ${r.gross > 0 ? html`<div class="hint">${Math.round(r.rate * 100)}% of pay goes to tax. Top federal bracket ${r.fedMarginal}%${st ? (st.bs ? ', ' + st.n + ' ' + r.stateMarginal + '%' : ', no ' + st.n + ' income tax') : ''}.</div>` : null}
          <div class="fields">
            <${Field} label="Salary / yr" tip=${FIELD_TIPS.gross}><${NumberInput} rule="amount" label="Salary per year" value=${c.gross} onCommit=${(v) => up({ gross: v })} /></${Field}>
            <${Field} label="Pre-tax / yr" tip=${FIELD_TIPS.pretax}><${NumberInput} rule="amount" label="Pre-tax deductions per year" value=${c.pretax} onCommit=${(v) => up({ pretax: v })} /></${Field}>
            ${stateField}
            <${Field} label="Filing"><${Select} label="Filing status" value=${c.filing || 'single'} options=${filingOptions()} searchable=${false} onChange=${(v) => up({ filing: v })} /></${Field}>
          </div>
          ${r.gross > 0 ? html`<div class="bd" aria-label="Yearly breakdown"><div class="eyebrow">Each year</div>
            ${row('Federal income tax', r.federal)}${row('Social Security', r.ss)}${row('Medicare', r.medicare)}
            ${st && !st.bs ? html`<div class="bd-row"><span>${st.n} income tax</span><b>None</b></div>` : row('State income tax', r.state)}
            ${r.pretax ? row('Pre-tax deductions', r.pretax) : null}
            ${row('Take-home pay', r.takeHome, 'total')}</div>` : null}
          ${note}
        </div><${Foot} c=${c} flows=${flows} label="Take-home per month" />`;
      }
      if (mode === 'property') {
        const rate = propRateFor(c), annual = num(c.homeValue) * rate / 100, custom = c.propRate != null && c.propRate !== '';
        return html`<div class="card-body">${modeSeg}
          <div><div class="eyebrow">Property tax per month</div><div class="hero">${money(annual / 12)}</div></div>
          <div class="hint">${money(annual)} a year at ${Math.round(rate * 100) / 100}%${custom ? ' (your rate)' : st ? ' (' + st.n + ' average)' : ''}.</div>
          <div class="fields">
            <${Field} label="Home value" tip=${FIELD_TIPS.homeValue}><${NumberInput} rule="amount" label="Home value" value=${c.homeValue} onCommit=${(v) => up({ homeValue: v })} /></${Field}>
            ${stateField}
          </div>
          <${Field} label="Effective rate" tip=${FIELD_TIPS.propRate}><${NumberInput} rule="propRate" suffix="%" label="Effective property tax rate" value=${rate} onCommit=${(v) => up({ propRate: v })} /></${Field}>
          ${custom && st ? html`<button class="add-row" onClick=${() => up({ propRate: null })}>Use the ${st.n} average (${st.p}%)</button>` : null}
          ${note}
        </div><${Foot} c=${c} flows=${flows} label="Property tax per month" />`;
      }
      const rate = salesRateFor(c), tax = num(c.spend) * rate / 100, custom = c.salesRate != null && c.salesRate !== '';
      return html`<div class="card-body">${modeSeg}
        <div><div class="eyebrow">Sales tax per month</div><div class="hero">${money(tax)}</div></div>
        <div class="hint">About ${money(tax * 12)} a year at ${rate}%${custom ? ' (your rate)' : st ? ' (' + st.n + ' average)' : ''}. For reference only: prices you pay already include it, so it isn’t added to your totals.</div>
        <div class="fields">
          <${Field} label="Taxable / mo" tip=${FIELD_TIPS.salesSpend}><${NumberInput} rule="amount" label="Taxable spending per month" value=${c.spend} onCommit=${(v) => up({ spend: v })} /></${Field}>
          ${stateField}
        </div>
        <${Field} label="Combined rate" tip=${FIELD_TIPS.salesRate}><${NumberInput} rule="salesRate" suffix="%" label="Sales tax rate" value=${rate} onCommit=${(v) => up({ salesRate: v })} /></${Field}>
        ${custom && st ? html`<button class="add-row" onClick=${() => up({ salesRate: null })}>Use the ${st.n} average (${st.s}%)</button>` : null}
        ${note}
      </div>`;
    }
    case 'debt': {
      const bal = num(c.balance), min = num(c.payment), extra = num(c.extra);
      const withExtra = payoff(bal, c.apr, min + extra), minOnly = payoff(bal, c.apr, min);
      const saves = extra > 0 && !withExtra.never ? (minOnly.never ? null : { interest: minOnly.interest - withExtra.interest, months: minOnly.months - withExtra.months }) : null;
      return html`<div class="card-body">
        <div><div class="eyebrow">${bal <= 0 ? 'Paid off' : withExtra.never ? 'Payoff date' : 'Debt-free by'}</div>
          <div class=${cls('hero', withExtra.never && bal > 0 && 'neg')} style=${{ fontSize: withExtra.never && bal > 0 ? '34px' : '46px' }}>${bal <= 0 ? 'Done' : withExtra.never ? 'Never at this rate' : monthLabel(withExtra.months)}</div></div>
        ${bal > 0 && !withExtra.never ? html`<div class="hint">${plural(withExtra.months, 'month')}, ${money(withExtra.interest)} in interest</div>` : null}
        ${bal > 0 && withExtra.never ? html`<div class="warn"><${Icon} n="alert" s=${18} />The payment doesn’t cover the ${money(withExtra.firstInterest)} of interest each month.</div>` : null}
        ${saves ? html`<div class="save-line"><${Icon} n="check" s=${18} w=${2.25} />Paying ${money(extra)} extra saves ${money(saves.interest)} in interest and ${plural(saves.months, 'month')}.</div>` : null}
        ${extra > 0 && minOnly.never && !withExtra.never ? html`<div class="save-line"><${Icon} n="check" s=${18} w=${2.25} />Without the extra payment this debt would never be paid off.</div>` : null}
        <div class="fields">
          <${Field} label="Balance" tip=${FIELD_TIPS.debtBalance}><${NumberInput} rule="debt" label="Balance owed" value=${c.balance} onCommit=${(v) => up({ balance: v })} /></${Field}>
          <${Field} label="Rate (APR)" tip=${FIELD_TIPS.apr}><${NumberInput} rule="apr" suffix="%" label="Interest rate" value=${c.apr} onCommit=${(v) => up({ apr: v })} /></${Field}>
          <${Field} label="Minimum" tip=${FIELD_TIPS.payment}><${NumberInput} rule="amount" label="Minimum payment" value=${c.payment} onCommit=${(v) => up({ payment: v })} /></${Field}>
          <${Field} label="Extra / mo" tip=${FIELD_TIPS.extra}><${NumberInput} rule="amount" label="Extra payment" value=${c.extra} onCommit=${(v) => up({ extra: v })} /></${Field}>
        </div>
      </div><${Foot} c=${c} flows=${flows} label="Payment per month" />`;
    }
    case 'split': {
      const pct = clamp(num(c.pct), 0, 100), inSum = flows.inSum[c.id] || 0;
      const srcs = flows.inputs[c.id] || [];
      return html`<div class="card-body">
        <${Field} label="Share to send" tip=${FIELD_TIPS.pct}><${NumberInput} suffix="%" rule="pct" label="Share to send" value=${pct} onCommit=${(v) => up({ pct: v })} /></${Field}>
        <input class="range" type="range" min="0" max="100" step="5" value=${pct} aria-label="Share to send" onChange=${(e) => up({ pct: Number(e.target.value) })} />
        <div class="hint">${pct}% of ${signed(inSum)} coming in</div>
        ${srcs.map((sid) => { const t = flows.splitPct[sid] || 0; return html`<div key=${sid} class=${cls('hint', t > 100 && 'neg')}>All splits from ${cardName(cards[sid])}: ${t}% of 100%</div>`; })}
      </div><${Foot} c=${c} flows=${flows} />`;
    }
    case 'goal': {
      const target = num(c.target), saved = num(c.saved), per = flows.inSum[c.id] || 0;
      const left = Math.max(0, target - saved), done = target > 0 && left === 0;
      const months = per > 0 && !done ? Math.ceil(left / per) : null;
      const pct = target > 0 ? clamp(saved / target * 100, 0, 100) : 0;
      return html`<div class="card-body">
        ${done ? html`<span class="done-pill"><${Icon} n="check" s=${16} w=${2.25} />Target reached</span>` : null}
        <div><div class="eyebrow">${done ? 'Saved' : months != null ? 'You get there by' : 'Not funded yet'}</div>
          <div class="hero" style=${{ fontSize: months != null || done ? '46px' : '30px' }}>${done ? money(saved) : months != null ? monthLabel(months) : 'Link money in'}</div></div>
        ${months != null ? html`<div class="hint">${plural(months, 'month')} at ${money(per)} a month, ${money(left)} to go</div>` : null}
        ${months == null && !done ? html`<div class="hint">Link an account or a split into this card to see when you’ll reach it.</div>` : null}
        <div class="bar" role="progressbar" aria-label="Saved so far" aria-valuenow=${Math.round(pct)} aria-valuemin="0" aria-valuemax="100"><span style=${{ width: pct + '%' }}></span></div>
        <div class="fields">
          <${Field} label="Target" tip=${FIELD_TIPS.target}><${NumberInput} rule="target" label="Target" value=${c.target} onCommit=${(v) => up({ target: v })} /></${Field}>
          <${Field} label="Saved" tip=${FIELD_TIPS.saved}><${NumberInput} rule="amount" label="Saved so far" value=${c.saved} onCommit=${(v) => up({ saved: v })} /></${Field}>
        </div>
      </div>`;
    }
    case 'file': {
      const src = c.assetId ? '/_blob/' + c.assetId : null;
      const isImg = /^image\//.test(c.type || ''), isCsv = /csv/.test(c.type || '') || /\.csv$/i.test(c.name || '');
      return html`<div class="card-body">
        ${isImg && src ? html`<img class="file-thumb" src=${src} alt=${c.name || 'Uploaded image'} draggable="false" />` : null}
        <div class="file-name">${c.name || 'Untitled file'}</div>
        <div class="file-meta">${(String(c.name || '').split('.').pop() || 'file').toUpperCase()} · ${fmtBytes(num(c.size))}</div>
        <div style=${{ display: 'flex', gap: '12px', alignItems: 'center' }}>
          ${src ? html`<a class="file-open" href=${src} target="_blank" rel="noopener">Open file</a>` : null}
          ${isCsv && src ? html`<button class="btn-sm" onClick=${() => onImport(src, c.name)}><${Icon} n="importIcon" s=${16} />Import transactions</button>` : null}
        </div>
      </div>`;
    }
    default: return null;
  }
}

function Card({ c, cards, x, y, flows, settings, selected, hot, lifted, ops, badge, onBadge, editor, onImport }) {
  const K = KINDS[c.kind];
  if (!K) return null;
  const up = (p) => ops.updateCard(c.id, p);
  return html`<div class=${cls('card', 'k-' + c.kind, selected && 'sel', hot && 'hot', lifted && 'lifted', badge && badge.level === 'error' && 'has-error', editor && 'peer-edit', editor && 'f' + editor.color)} data-card=${c.id} style=${{ left: x, top: y, width: K.w }}>
    ${editor ? html`<span class=${'edit-tag p' + editor.color}>${editor.name} is editing</span>` : null}
    ${portsFor(c).inPort ? html`<div class="port in" aria-hidden="true"></div>` : null}
    ${portsFor(c).outPort ? html`<div class="port out" data-port="out" data-card=${c.id} title="Drag to link" aria-hidden="true"></div>` : null}
    ${c.kind === 'note'
      ? html`<div class="note-grip"></div><${NoteText} c=${c} up=${up} />`
      : html`<div class="card-head">
          <span class="kind"><${Icon} n=${c.kind} /></span>
          <div class="head-text"><span class="eyebrow">${c.kind === 'account' ? ACCOUNT_TYPES[atypeOf(c)] + ' account' : K.label}</span>
            ${c.kind === 'file' ? html`<span class="title-input" style=${{ cursor: 'grab' }}>${c.name}</span>` : html`<${TextInput} className="title-input" required label=${K.label + ' name'} value=${c.title} onCommit=${(v) => up({ title: v })} />`}
          </div>
          ${badge ? html`<button class=${cls('chk', 'lv-' + badge.level)} aria-label=${plural(badge.count, 'check') + ' on this card'} onClick=${() => onBadge(c.id)}><${Icon} n=${LV_ICON[badge.level]} s=${14} w=${2} />${badge.count}</button>` : null}
          <${Info} label=${c.kind === 'account' ? ACCOUNT_TYPES[atypeOf(c)] + ' account' : K.label} text=${tipFor(c)} side="right" />
        </div>
        <${Body} c=${c} cards=${cards} flows=${flows} settings=${settings} up=${up} onImport=${onImport} />`}
  </div>`;
}
function NoteText({ c, up }) {
  const [draft, setDraft] = useState(null);
  return html`<textarea class="note-text" aria-label="Note" maxlength="2000" placeholder="Write a note for the team" value=${draft != null ? draft : (c.text || '')}
    onFocus=${() => setDraft(c.text || '')} onChange=${(e) => setDraft(e.target.value)}
    onBlur=${() => { if (draft != null && draft !== (c.text || '')) up({ text: draft.slice(0, 2000) }); setDraft(null); }}></textarea>`;
}

/* ---------- geometry ---------- */
const portOut = (c, pos) => ({ x: pos.x + (KINDS[c.kind] || KINDS.income).w, y: pos.y + PORT_Y });
const portIn = (pos) => ({ x: pos.x, y: pos.y + PORT_Y });
function curve(a, b) {
  const dx = Math.max(60, Math.abs(b.x - a.x) / 2);
  const c1 = { x: a.x + dx, y: a.y }, c2 = { x: b.x - dx, y: b.y };
  const mid = { x: 0.125 * a.x + 0.375 * c1.x + 0.375 * c2.x + 0.125 * b.x, y: 0.125 * a.y + 0.375 * c1.y + 0.375 * c2.y + 0.125 * b.y };
  return { d: `M${a.x},${a.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${b.x - 8},${b.y}`, mid };
}

/* ---------- panels ---------- */
function Panel({ title, sub, onClose, wide, children }) {
  useEffect(() => {
    const k = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k);
  }, [onClose]);
  return html`<div class="scrim phone-only" onClick=${onClose}></div>
    <aside class=${cls('panel', wide && 'wide')} role="dialog" aria-label=${title}>
      <div class="grab"></div>
      <div class="panel-head"><div style=${{ flex: 1 }}><h2>${title}</h2>${sub ? html`<p>${sub}</p>` : null}</div>
        <button class="close" aria-label=${'Close ' + title} onClick=${onClose}><${Icon} n="x" /></button></div>
      <div class="panel-body">${children}</div>
    </aside>`;
}

function ChecksPanel({ checks, cards, onClose, onShow, onFix }) {
  const groups = [['error', 'Needs fixing'], ['warn', 'Worth a look'], ['tip', 'Best practice']];
  return html`<${Panel} title="Checks" sub="Problems with your numbers and tips from common budgeting practice. Updated as you edit." onClose=${onClose}>

    ${groups.map(([lv, label]) => {
      const rows = checks.list.filter((x) => x.level === lv);

          </div>` : null}

    })}
  <//>`;
}

function TemplatesPanel({ onClose, onAdd, onImport }) {
  const previews = useMemo(() => TEMPLATES.map(templatePreview), []);
  return html`<${Panel} title="Templates" sub="Starter boards you can edit. They are added next to your cards, and nothing is replaced." onClose=${onClose}>
    <div class="import-cta"><${Icon} n="importIcon" s=${28} /><div><b>Start from your bank statement</b>Turn a CSV export into income, bills and spending cards.</div>
      <button class="btn-sm primary" onClick=${onImport}>Import</button></div>

const Row = ({ label, sub, tip, children }) => html`<div class="set-row"><div class="set-label"><span>${label}${sub ? html`<small>${sub}</small>` : null}</span>${tip ? html`<${Info} label=${label} text=${tip} />` : null}</div>${children}</div>`;
function SettingsPanel({ settings, cards, prefs, setPrefs, ops, onClose, onArrange, onClear, scenarioName, focusA11y }) {

  const s = settings, set = (p) => ops.setSettings(p), setAuto = (k, v) => ops.setSettings({ auto: { [k]: v } });
  const accounts = Object.values(cards).filter((c) => c.kind === 'account');
  const [confirm, setConfirm] = useState(false);
  const count = Object.keys(cards).length;
  const AUTOS = [
    ['linkOutflows', html`<b>When you add a Spend, Recurring or Debt card,</b> link it to the main account.`, 'Link new spending, bills and debts to the main account'],
    ['linkIncome', html`<b>When you add an Income card,</b> link it to the main account.`, 'Link new income to the main account'],
    ['payYourselfFirst', html`<b>When you add an Income card,</b> also send ${s.savingsTarget}% to your first savings goal through a Split.`, 'Pay yourself first from new income'],
    ['notifyChecks', html`<b>When a change causes a new problem,</b> tell me right away.`, 'Tell me about new problems'],
    ['goalAlert', html`<b>When a goal’s saved amount reaches its target,</b> tell everyone on the board.`, 'Celebrate reached goals']
  ];
  return html`<${Panel} title="Settings" sub="Settings apply to everyone and every scenario on this board, except Display and Accessibility, which are just for you." onClose=${onClose}>
    <section class="group"><div class="eyebrow">Money</div>
      <${Row} label="Currency" tip="Changes how amounts are shown. It doesn’t convert them.">
        <span class="set-control"><${Select} label="Currency" value=${s.currency} searchable=${false} options=${Object.entries(CURRENCIES).map(([k, v]) => ({ value: k, label: k + ' \u00b7 ' + v }))} onChange=${(v) => set({ currency: v })} /></span><//>
      <${Row} label="Default projection" tip=${FIELD_TIPS.horizon + ' New Account cards and scenario comparisons use this.'}>
        <span class="set-control"><${Select} label="Default projection" value=${s.horizon} searchable=${false} options=${[3, 6, 12, 24].map((m) => ({ value: m, label: m + ' months' }))} onChange=${(v) => set({ horizon: Number(v) })} /></span><//>
    </section>
    <section class="group"><div class="eyebrow">Taxes</div>
      <${Row} label="Home state" tip="New Taxes cards and the salary template start with this state.">
        <span class="set-control wide"><${Select} label="Home state" placeholder="Not set" value=${s.state} options=${stateOptions('Not set')} onChange=${(v) => set({ state: v })} /></span><//>
      <${Row} label="Filing status" tip="Sets the federal and state brackets on new Taxes cards. Head of household uses single brackets for state tax.">
        <span class="set-control wide"><${Select} label="Filing status" value=${s.filing} searchable=${false} options=${filingOptions()} onChange=${(v) => set({ filing: v })} /></span><//>
      <p class="muted">Rates are for ${TAX_YEAR}. Federal brackets and deductions come from the <a href="https://www.irs.gov/newsroom/irs-releases-tax-inflation-adjustments-for-tax-year-2026-including-amendments-from-the-one-big-beautiful-bill" target="_blank" rel="noopener">IRS</a>. State income, sales and property rates come from the <a href="https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/" target="_blank" rel="noopener">Tax Foundation</a>. They’re built into the board and stay the same until the app is updated. Estimates only, not tax advice.</p>
    </section>
    <section class="group"><div class="eyebrow">Budget rules</div>
      <${Row} label="Savings target" sub="Share of income into goals" tip="Many planners suggest saving at least 20% of take-home pay. Start lower and raise it each time your income goes up.">
        <span class="set-control"><${NumberInput} suffix="%" rule="settingPct" label="Savings target" value=${s.savingsTarget} onCommit=${(v) => set({ savingsTarget: v })} /></span><//>
      <${Row} label="Fixed bills limit" sub="Bills and debt payments, as a share of income" tip="Keeping fixed bills and debt payments under about half of take-home pay leaves room for savings and surprises.">
        <span class="set-control"><${NumberInput} suffix="%" rule="settingPct" label="Fixed bills limit" value=${s.billsCap} onCommit=${(v) => set({ billsCap: v })} /></span><//>
      <${Row} label="Cash buffer" sub="Warn when an account drops below" tip="A buffer of about one month of expenses in checking covers timing gaps between paydays and bills.">
        <span class="set-control"><${NumberInput} rule="buffer" label="Cash buffer" value=${s.buffer} onCommit=${(v) => set({ buffer: v })} /></span><//>
      <${Row} label="Yearly price increase" sub="Applied to money going out in projections" tip="Rent, insurance and subscriptions tend to go up every year. 3% is a common planning figure.">
        <span class="set-control"><${NumberInput} suffix="%" rule="inflation" label="Yearly price increase" value=${s.inflation} onCommit=${(v) => set({ inflation: v })} /></span><//>
